dân chỉ là đối tượng phục vụ của Đảng"]],"a":["A"],"c":4,"s":[],"y":"Nhân dân là nguồn gốc và động lực của Đảng.","t":"Nguồn gốc."}];
const BY={}; DATA.forEach(q=>BY[q.n]=q);
const {useState,useEffect,useMemo,useCallback,useRef}=React;
const html=htm.bind(React.createElement);
const ROMAN=['','I','II','III','IV','V','VI'];
const MIN=60000, DAY=1440;
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};

// ---------- durations ----------
function parseDur(s){s=String(s).trim().toLowerCase();const m=s.match(/^(\d+(?:[.,]\d+)?)\s*(m|p|phút|h|g|giờ|d|n|ngày)?$/);if(!m)return NaN;const v=parseFloat(m[1].replace(',','.'));const u=m[2]||'m';
  return u==='h'||u==='g'||u==='giờ'?v*60:(u==='d'||u==='n'||u==='ngày')?v*DAY:v}
function parseSteps(s){const a=String(s).split(/[\s,;]+/).filter(Boolean).map(parseDur);return a.length&&a.every(x=>x>0)?a:null}
function durTxt(m){if(m<DAY)return m%60===0&&m>=60?(m/60)+'h':Math.round(m)+'m';return +(m/DAY).toFixed(1)+'d'}
function fmt(m){if(m<1)return '< 1 phút';if(m<60)return Math.round(m)+' phút';if(m<DAY){const h=m/60;return (h<10?+h.toFixed(1):Math.round(h))+' giờ'}const d=m/DAY;if(d<30)return (d<10?+d.toFixed(1):Math.round(d))+' ngày';if(d<365)return +(d/30).toFixed(1)+' tháng';return +(d/365).toFixed(1)+' năm'}
function clock(ts){const d=new Date(ts),n=new Date();const hm=d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
  const day=(a)=>new Date(a.getFullYear(),a.getMonth(),a.getDate()).getTime();const diff=Math.round((day(d)-day(n))/86400000);
  return diff===0?hm+' hôm nay':diff===1?hm+' ngày mai':hm+' '+d.toLocaleDateString('vi-VN')}

// ---------- presets (Anki-like) ----------
const PRESETS={
  cram:{name:'Thi gấp',steps:[1,10,60],relearn:[10],grad:240,easy:DAY,cap:2*DAY,startEase:2.5,easyBonus:1.3,hardMul:1.2,ivlMod:1,lapsePct:30,minLapse:60},
  normal:{name:'Giống Anki mặc định',steps:[1,10],relearn:[10],grad:DAY,easy:4*DAY,cap:36500*DAY,startEase:2.5,easyBonus:1.3,hardMul:1.2,ivlMod:1,lapsePct:0,minLapse:DAY}
};
const DEFCFG={preset:'cram',...PRESETS.cram,newPerDay:80,chs:[1,2,3,4,5,6],order:'random'};

// rating: 1 Lại, 2 Khó, 3 Được, 4 Dễ. Returns [newCard, intervalMinutes]
function schedule(c0,r,P){
  const c={...c0}, now=Date.now(); let ivl;
  if(c.ease==null)c.ease=P.startEase;
  if(c.st==='new'||c.st==='learn'||c.st==='relearn'){
    const relearn=c.st==='relearn', steps=relearn?P.relearn:P.steps;
    let step=c.st==='new'?0:Math.min(c.step||0,steps.length-1);
    if(r===1){step=0;ivl=steps[0];c.st=relearn?'relearn':'learn'}
    else if(r===2){ivl=step===0?(steps.length>1?(steps[0]+steps[1])/2:steps[0]*1.5):steps[step];c.st=relearn?'relearn':'learn'}
    else if(r===3){step++;if(step>=steps.length){c.st='review';ivl=relearn?Math.max(P.minLapse,c.ivl||P.grad):P.grad;c.ivl=Math.min(ivl,P.cap);ivl=c.ivl;step=0}else{ivl=steps[step];c.st=relearn?'relearn':'learn'}}
    else {c.st='review';ivl=relearn?Math.max(P.minLapse,(c.ivl||P.grad))*P.easyBonus:P.easy;c.ivl=Math.min(ivl,P.cap);ivl=c.ivl;step=0}
    c.step=step;
  } else {
    const cur=c.ivl||P.grad;
    if(r===1){c.lapses=(c.lapses||0)+1;c.ease=Math.max(1.3,c.ease-0.2);c.st='relearn';c.step=0;c.ivl=Math.max(P.minLapse,cur*P.lapsePct/100);ivl=P.relearn[0]}
    else if(r===2){c.ease=Math.max(1.3,c.ease-0.15);ivl=Math.min(P.cap,Math.max(cur*P.hardMul*P.ivlMod,cur+1));c.ivl=ivl}
    else if(r===3){ivl=Math.min(P.cap,Math.max(cur*c.ease*P.ivlMod,cur*P.hardMul+1));c.ivl=ivl}
    else {c.ease+=0.15;ivl=Math.min(P.cap,cur*c.ease*P.easyBonus*P.ivlMod);c.ivl=ivl}
  }
  c.reps=(c.reps||0)+1;c.due=now+ivl*MIN;c.last=now;
  c.log=[...(c.log||[]).slice(-19),[now,r,Math.round(ivl)]];
  return [c,ivl];
}
const stName=c=>!c||c.st==='new'?'Mới':c.st==='review'?'Ôn tập':c.st==='relearn'?'Học lại':'Đang học';
const stCls=c=>!c||c.st==='new'?'new':c.st==='review'?'review':'learn';
const RN=['','Lại','Khó','Được','Dễ'];

function App(){
  const [cards,setCards]=useState(()=>store.get('hcm_srs_v1',{}));
  const [cfg,setCfg]=useState(()=>({...DEFCFG,...store.get('hcm_srs_cfg2',{})}));
  const [day,setDay]=useState(()=>store.get('hcm_srs_day',{d:today(),newSeen:0,done:0,ok:0}));
  const [now,setNow]=useState(Date.now());
  const [tab,setTab]=useState('home');
  const [mode,setMode]=useState('home');
  useEffect(()=>{const h=()=>{if(location.hash!=='#hoc')setMode('home')};window.addEventListener('hashchange',h);try{if(location.hash==='#hoc')history.replaceState(null,'',location.pathname+location.search)}catch(e){}return()=>window.removeEventListener('hashchange',h)},[]);
  const [cur,setCur]=useState(null);
  const [pick,setPick]=useState([]);
  const [shown,setShown]=useState(false);
  const [ahead,setAhead]=useState(false);
  const [toast,setToast]=useState(null);
  const tRef=useRef();
  useEffect(()=>store.set('hcm_srs_v1',cards),[cards]);
  useEffect(()=>store.set('hcm_srs_cfg2',cfg),[cfg]);
  useEffect(()=>store.set('hcm_srs_day',day),[day]);
  useEffect(()=>{const t=setInterval(()=>setNow(Date.now()),10000);return()=>clearInterval(t)},[]);
  useEffect(()=>{if(day.d!==today())setDay({d:today(),newSeen:0,done:0,ok:0})},[now]);
  const P=cfg;
  const pool=useMemo(()=>DATA.filter(q=>cfg.chs.includes(q.c)),[cfg.chs]);
  const counts=useMemo(()=>{let nw=0,lr=0,lrDue=0,due=0,later=Infinity,mature=0;
    pool.forEach(q=>{const c=cards[q.n];if(!c){nw++;return}
      if(c.st!=='review'){lr++;if(c.due<=now)lrDue++}else if(c.due<=now)due++;
      if(c.due>now)later=Math.min(later,c.due);if(c.st==='review'&&c.ivl>=DAY)mature++});
    return {nw,lr,lrDue,due,later,mature,newLeft:Math.max(0,Math.min(nw,cfg.newPerDay-day.newSeen))}},[pool,cards,now,cfg.newPerDay,day.newSeen]);

  const next=useCallback(()=>{
    const t=Date.now(), ids=pool.map(q=>q.n);
    const L=ids.filter(n=>cards[n]&&cards[n].st!=='review'&&cards[n].due<=t).sort((a,b)=>cards[a].due-cards[b].due);
    const R=ids.filter(n=>cards[n]&&cards[n].st==='review'&&cards[n].due<=t).sort((a,b)=>cards[a].due-cards[b].due);
    const F=ids.filter(n=>!cards[n]);
    let n=null;
    if(L.length)n=L[0];
    else if(R.length)n=R[0];
    else if(F.length&&day.newSeen<cfg.newPerDay)n=cfg.order==='random'?F[Math.floor(Math.random()*F.length)]:F[0];
    else{const A=ids.filter(n=>cards[n]&&cards[n].st!=='review'&&cards[n].due<=t+20*MIN).sort((a,b)=>cards[a].due-cards[b].due);
      if(A.length)n=A[0];
      else if(ahead){const all=ids.filter(n=>cards[n]).sort((a,b)=>cards[a].due-cards[b].due);if(all.length)n=all[0]}}
    setCur(n==null?null:BY[n]);setPick([]);setShown(false);
  },[pool,cards,cfg.newPerDay,cfg.order,day.newSeen,ahead]);
  useEffect(()=>{if(!cur&&mode==='study')next()},[now,cfg.chs,cfg.newPerDay,cards,mode,ahead]);

  const card=cur?(cards[cur.n]||{st:'new'}):null;
  const correct=cur&&shown&&pick.length===cur.a.length&&pick.every(k=>cur.a.includes(k));
  const choose=k=>{if(shown||!cur)return;const p=[...pick,k];setPick(p);if(!cur.a.includes(k)||p.length>=cur.a.length)setShown(true)};
  const showToast=m=>{setToast(m);clearTimeout(tRef.current);tRef.current=setTimeout(()=>setToast(null),4500)};
  const rate=r=>{if(!cur||!shown)return;const [nc,ivl]=schedule(card,r,P);
    setCards(cs=>({...cs,[cur.n]:nc}));
    setDay(d=>({...d,newSeen:d.newSeen+(card.st==='new'?1:0),done:d.done+1,ok:d.ok+(correct?1:0)}));
    showToast('Câu '+cur.n+' · '+RN[r]+' → gặp lại sau '+fmt(ivl)+' (lúc '+clock(nc.due)+')');
    setCur(null);setPick([]);setShown(false);setNow(Date.now())};
  useEffect(()=>{const h=e=>{if(mode!=='study'||/TEXTAREA|INPUT|SELECT/.test(e.target.tagName))return;if(e.key==='Escape'){e.preventDefault();exitStudy();return}if(!cur)return;const k=e.key.toUpperCase();
    if(!shown){const map={A:'A',B:'B',C:'C',D:'D',E:'E','1':'A','2':'B','3':'C','4':'D','5':'E'};if(map[k]&&cur.o.some(o=>o[0]===map[k])){e.preventDefault();choose(map[k])}}
    else{if(['1','2','3','4'].includes(k)){e.preventDefault();rate(+k)}else if(k===' '||k==='ENTER'){e.preventDefault();rate(correct?3:1)}}};
    window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h)});
  const toggleCh=c=>setCfg(s=>{const chs=s.chs.includes(c)?s.chs.filter(x=>x!==c):[...s.chs,c].sort();return {...s,chs:chs.length?chs:s.chs}});
  const pv=card?[1,2,3,4].map(r=>schedule(card,r,P)[1]):[];

  const bodyRef=useRef();
  useEffect(()=>{if(bodyRef.current)bodyRef.current.scrollTop=0},[cur&&cur.n,mode]);
  const startStudy=()=>{setAhead(false);try{location.hash='hoc'}catch(e){}setMode('study')};
  const exitStudy=()=>{setMode('home');try{if(location.hash==='#hoc')history.back()}catch(e){}};
  const totalDue=counts.newLeft+counts.lrDue+counts.due;

  const Study=html`<div className="study" role="dialog" aria-label="Màn hình học">
    <div className="sbar">
      <button className="btn" onClick=${exitStudy}>← Thoát</button>
      <div className="cnt" title="Mới · Học lại · Đến hạn"><span className="c-new">${counts.newLeft}</span><span className="c-learn">${counts.lrDue}</span><span className="c-due">${counts.due}</span></div>
      <span className="note">${cur?'Câu '+cur.n+' · Ch.'+ROMAN[cur.c]:''}</span>
    </div>
    <div className="sbody" ref=${bodyRef}><div className="sinner">
    ${!cur?html`<div className="empty"><h2>Xong phần hiện tại</h2>
        <p className="note">${counts.later<Infinity?'Thẻ tiếp theo đến hạn sau '+fmt((counts.later-now)/MIN)+' (lúc '+clock(counts.later)+'). Để màn hình này mở, thẻ sẽ tự hiện khi đến giờ.':'Bạn đã xem hết thẻ trong các chương đã chọn.'}</p>
        <div className="row" style=${{justifyContent:'center'}}>
          ${counts.nw>0&&counts.newLeft===0?html`<button className="btn pri" onClick=${()=>setDay(d=>({...d,newSeen:Math.max(0,d.newSeen-20)}))}>Học thêm 20 thẻ mới</button>`:null}
          ${Object.keys(cards).length?html`<button className="btn" onClick=${()=>setAhead(true)}>Học trước thẻ sắp đến hạn</button>`:null}
          <button className="btn" onClick=${exitStudy}>Về màn hình chính</button></div></div>`:
    html`<div>
        <div className="meta"><span className=${'pill '+stCls(card)}>${stName(card)}</span>${card.lapses?html`<span>Đã quên ${card.lapses} lần</span>`:null}
          ${card.due&&card.due>now?html`<span>(học trước, hạn ${clock(card.due)})</span>`:null}</div>
        <div className="q">${cur.q}${cur.a.length>1?html` <span className="note">(chọn ${cur.a.length})</span>`:null}</div>
        <div className="opts">${cur.o.map(([k,t])=>{let cl='opt';if(shown){if(cur.a.includes(k))cl+=' right';else if(pick.includes(k))cl+=' wrong'}else if(pick.includes(k))cl+=' sel';
          return html`<button key=${k} className=${cl} disabled=${shown} onClick=${()=>choose(k)}><span className="k">${k}</span><span>${t}</span></button>`})}</div>
        ${shown?html`<div>
          <div className=${'verdict '+(correct?'ok':'no')}>${correct?'Đúng rồi':'Chưa đúng. Đáp án: '+cur.a.join(', ')}</div>
          <div className="box why"><b className="t">Vì sao chọn đáp án này</b>${cur.y}</div>
          <div className="box trick"><b className="t">Mẹo nhận biết</b>${cur.t}</div>
          ${cur.w?html`<div className="box warn"><b className="t">Lệch giáo trình</b>${cur.w}</div>`:null}
          ${cur.s&&cur.s.length?html`<div className="box sim"><b className="t">Câu tương tự, dễ nhầm</b><ul>${cur.s.map(m=>{const s=BY[m];const a=s.o.filter(o=>s.a.includes(o[0])).map(o=>o[1]).join(' | ');
            return html`<li key=${m}><span className="note">Câu ${m}:</span> ${s.q} → <span className="a">${a}</span></li>`})}</ul></div>`:null}
          <${Info} c=${card} now=${now}/>
        </div>`:null}
    </div>`}
    </div></div>
    <div className="sfoot">${cur&&shown?html`<div className="rate">${[1,2,3,4].map(r=>html`<button key=${r} className=${(r===1?'again':r===3?'good':'')+((r===1&&!correct)||(r===3&&correct)?' rec':'')} onClick=${()=>rate(r)}><small>${fmt(pv[r-1])}</small>${RN[r]} <kbd>${r}</kbd></button>`)}</div>`:
      cur?html`<div className="hint">Chọn đáp án: bấm hoặc phím A–E / 1–5 · Esc để thoát</div>`:html`<div className="hint">Esc để thoát</div>`}</div>
    ${toast?html`<div className="toast st" role="status">${toast}</div>`:null}
  </div>`;

  if(mode==='study')return Study;
  return html`<div className="wrap">
    <header><h1>Thẻ ôn <span>HCM202</span></h1><span className="note">Chế độ: <b>${PRESETS[cfg.preset]?PRESETS[cfg.preset].name:'Tùy chỉnh'}</b></span></header>
    <div className="tabs">${[['home','Tổng quan'],['browse','Danh sách thẻ'],['forecast','Lịch sắp tới'],['settings','Cài đặt']].map(([k,l])=>html`<button key=${k} className=${tab===k?'on':''} onClick=${()=>setTab(k)}>${l}</button>`)}</div>
    <div className="chips">${[1,2,3,4,5,6].map(c=>html`<button key=${c} className=${'chip'+(cfg.chs.includes(c)?' on':'')} onClick=${()=>toggleCh(c)}>Chương ${ROMAN[c]}</button>`)}</div>
    ${tab==='home'?html`<div>
      <div className="deck">
        <div className="dcounts">
          <div><b className="c-new">${counts.newLeft}</b><span>Mới</span></div>
          <div><b className="c-learn">${counts.lrDue}</b><span>Học lại</span></div>
          <div><b className="c-due">${counts.due}</b><span>Đến hạn</span></div>
        </div>
        <button className="btn pri big" onClick=${startStudy}>${totalDue?'Học ngay':'Mở màn hình học'}</button>
        <p className="note">${totalDue?'Có '+totalDue+' thẻ đang chờ. Phím tắt khi học: A–E chọn đáp án, 1–4 chấm, Enter chấm theo kết quả, Esc thoát.':counts.later<Infinity?'Thẻ tiếp theo đến hạn lúc '+clock(counts.later)+'.':'Đã xem hết thẻ.'}</p>
      </div>
      <div className="stats">
        <div className="stat"><b>${day.done}</b><span>Đã ôn hôm nay</span></div>
        <div className="stat"><b>${day.done?Math.round(day.ok/day.done*100)+'%':'–'}</b><span>Đúng hôm nay</span></div>
        <div className="stat"><b>${counts.lr}</b><span>Đang học (tổng)</span></div>
        <div className="stat"><b>${counts.mature}</b><span>Đã thuộc ≥ 1 ngày</span></div>
      </div></div>`:
     tab==='browse'?html`<${Browse} pool=${pool} cards=${cards} setCards=${setCards} now=${now} P=${P} showToast=${showToast}/>`:
     tab==='forecast'?html`<${Forecast} pool=${pool} cards=${cards} now=${now} counts=${counts}/>`:
     html`<${Settings} cfg=${cfg} setCfg=${setCfg} cards=${cards} setCards=${setCards} setDay=${setDay} counts=${counts}/>`}
    ${toast?html`<div className="toast" role="status">${toast}</div>`:null}
  </div>`;
}


function Info({c,now}){
  if(!c||c.st==='new')return html`<div className="info"><div><span className="note">Thẻ mới</span><b>Chưa có lịch</b></div></div>`;
  return html`<div className="info">
    <div><span className="note">Khoảng cách hiện tại</span><b>${c.st==='review'?fmt(c.ivl):'bước '+((c.step||0)+1)}</b></div>
    <div><span className="note">Đến hạn</span><b>${c.due<=now?'Ngay bây giờ':fmt((c.due-now)/MIN)}</b></div>
    <div><span className="note">Ease</span><b>${Math.round((c.ease||2.5)*100)}%</b></div>
    <div><span className="note">Ôn / Quên</span><b>${c.reps||0} / ${c.lapses||0}</b></div></div>`;
}

function Browse({pool,cards,setCards,now,P,showToast}){
  const [f,setF]=useState('studied');const [sort,setSort]=useState('due');const [open,setOpen]=useState(null);
  let rows=pool.map(q=>({q,c:cards[q.n]}));
  rows=rows.filter(({c})=>f==='all'?true:f==='new'?!c:f==='studied'?!!c:f==='learn'?c&&c.st!=='review':f==='review'?c&&c.st==='review':f==='due'?c&&c.due<=now:f==='lapsed'?c&&c.lapses>0:true);
  const key={due:({c})=>c?c.due:Infinity,n:({q})=>q.n,ivl:({c})=>c&&c.st==='review'?-c.ivl:1,lapses:({c})=>c?-(c.lapses||0):1,ease:({c})=>c?c.ease:9}[sort];
  rows.sort((a,b)=>key(a)-key(b));
  const act=(n,how)=>setCards(cs=>{const c={...(cs[n]||{})};if(how==='now'){if(!cs[n])return cs;c.due=Date.now();showToast('Câu '+n+' đã đặt đến hạn ngay')}else{const x={...cs};delete x[n];showToast('Câu '+n+' trở về thẻ mới');return x}return {...cs,[n]:c}});
  return html`<div>
    <div className="row" style=${{margin:'4px 0 10px'}}>${[['studied','Đã học'],['due','Đến hạn'],['learn','Đang học'],['review','Ôn tập'],['lapsed','Từng quên'],['new','Mới'],['all','Tất cả']].map(([k,l])=>html`<button key=${k} className=${'chip'+(f===k?' on':'')} onClick=${()=>setF(k)}>${l}</button>`)}</div>
    <div className="note" style=${{marginBottom:'6px'}}>${rows.length} thẻ · bấm tiêu đề cột để sắp xếp · bấm dòng để xem lịch sử chấm</div>
    <div className="tbl"><table><thead><tr>
      <th onClick=${()=>setSort('n')}>Câu</th><th>Trạng thái</th><th onClick=${()=>setSort('due')}>Lặp lại lúc ▾</th><th onClick=${()=>setSort('ivl')}>Khoảng cách</th><th onClick=${()=>setSort('ease')}>Ease</th><th onClick=${()=>setSort('lapses')}>Quên</th><th></th></tr></thead>
    <tbody>${rows.slice(0,400).map(({q,c})=>html`<${React.Fragment} key=${q.n}><tr onClick=${()=>setOpen(open===q.n?null:q.n)} style=${{cursor:'pointer'}}>
      <td><b>${q.n}</b> <span className="note">Ch.${ROMAN[q.c]}</span></td>
      <td><span className=${'pill '+stCls(c)}>${stName(c)}</span></td>
      <td>${c?(c.due<=now?html`<b style=${{color:'var(--bad)'}}>Đến hạn</b>`:html`sau ${fmt((c.due-now)/MIN)}<br/><span className="note">${clock(c.due)}</span>`):'–'}</td>
      <td>${c?(c.st==='review'?fmt(c.ivl):'bước '+((c.step||0)+1)):'–'}</td>
      <td>${c?Math.round(c.ease*100)+'%':'–'}</td><td>${c?c.lapses||0:'–'}</td>
      <td onClick=${e=>e.stopPropagation()}>${c?html`<button className="btn mini" onClick=${()=>act(q.n,'now')}>Ôn ngay</button> <button className="btn mini" onClick=${()=>act(q.n,'reset')}>Đặt lại</button>`:null}</td></tr>
      ${open===q.n?html`<tr><td colSpan="7" className="qt"><div>${q.q}</div><div className="note" style=${{marginTop:'4px'}}>Đáp án: ${q.o.filter(o=>q.a.includes(o[0])).map(o=>o[1]).join(' | ')}</div>
        ${c&&c.log?html`<div className="note" style=${{marginTop:'4px'}}>Lịch sử: ${c.log.map(([t,r,iv])=>new Date(t).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'})+' '+RN[r]+' → '+fmt(iv)).join(' · ')}</div>`:null}</td></tr>`:null}
    </${React.Fragment}>`)}</tbody></table></div>
    ${rows.length>400?html`<p className="note">Đang hiện 400 thẻ đầu.</p>`:null}
  </div>`;
}

function Forecast({pool,cards,now,counts}){
  const cs=pool.map(q=>cards[q.n]).filter(Boolean);
  const within=m=>cs.filter(c=>c.due<=now+m*MIN).length;
  const eod=new Date();eod.setHours(23,59,59,999);const tomorrowEnd=eod.getTime()+86400000;
  const buckets=[];
  for(let h=0;h<24;h++){const a=now+h*60*MIN,b=a+60*MIN;buckets.push(['+'+h+'–'+(h+1)+' giờ',cs.filter(c=>c.due>a&&c.due<=b).length])}
  for(let d=1;d<=7;d++){const s=new Date(eod.getTime()+(d-1)*86400000+1),e=eod.getTime()+d*86400000;buckets.push([s.toLocaleDateString('vi-VN',{weekday:'short',day:'2-digit',month:'2-digit'}),cs.filter(c=>c.due>s.getTime()&&c.due<=e).length])}
  const nonzero=buckets.filter(b=>b[1]>0);const max=Math.max(1,...buckets.map(b=>b[1]));
  return html`<div>
    <div className="fc">
      <div><b>${within(0)}</b><span>Đến hạn ngay</span></div>
      <div><b>${within(60)}</b><span>Trong 1 giờ tới</span></div>
      <div><b>${cs.filter(c=>c.due<=eod.getTime()).length}</b><span>Đến hết hôm nay</span></div>
      <div><b>${cs.filter(c=>c.due>eod.getTime()&&c.due<=tomorrowEnd).length}</b><span>Ngày mai</span></div>
      <div><b>${counts.mature}</b><span>Đã thuộc (≥ 1 ngày)</span></div>
      <div><b>${counts.nw}</b><span>Chưa học</span></div>
    </div>
    <div className="card"><b>Số thẻ sẽ đến hạn theo khung giờ</b>
      ${nonzero.length?html`<div className="bars">${nonzero.map(([l,v])=>html`<div className="r" key=${l}><span className="note">${l}</span><i style=${{width:(v/max*100)+'%'}}></i><span>${v}</span></div>`)}</div>`:html`<p className="note">Chưa có thẻ nào được lên lịch. Học vài thẻ ở tab Học để thấy lịch.</p>`}
    </div></div>`;
}

function Settings({cfg,setCfg,cards,setCards,setDay,counts}){
  const [form,setForm]=useState(()=>({steps:cfg.steps.map(durTxt).join(' '),relearn:cfg.relearn.map(durTxt).join(' '),grad:durTxt(cfg.grad),easy:durTxt(cfg.easy),cap:durTxt(cfg.cap),minLapse:durTxt(cfg.minLapse),
    startEase:Math.round(cfg.startEase*100),easyBonus:Math.round(cfg.easyBonus*100),hardMul:Math.round(cfg.hardMul*100),ivlMod:Math.round(cfg.ivlMod*100),lapsePct:cfg.lapsePct,newPerDay:cfg.newPerDay}));
  const [msg,setMsg]=useState('');const [io,setIo]=useState('');const [confirm,setConfirm]=useState(false);
  const applyPreset=k=>{const p=PRESETS[k];setCfg(s=>({...s,...p,preset:k}));setForm(f=>({...f,steps:p.steps.map(durTxt).join(' '),relearn:p.relearn.map(durTxt).join(' '),grad:durTxt(p.grad),easy:durTxt(p.easy),cap:durTxt(p.cap),minLapse:durTxt(p.minLapse),startEase:p.startEase*100,easyBonus:p.easyBonus*100,hardMul:p.hardMul*100,ivlMod:p.ivlMod*100,lapsePct:p.lapsePct}));setMsg('Đã áp dụng chế độ '+p.name+'.')};
  const save=()=>{const st=parseSteps(form.steps),rl=parseSteps(form.relearn),g=parseDur(form.grad),e=parseDur(form.easy),cp=parseDur(form.cap),ml=parseDur(form.minLapse);
    if(!st||!rl||[g,e,cp,ml].some(x=>!(x>0))){setMsg('Có ô thời gian chưa đúng dạng. Dùng số kèm m (phút), h (giờ) hoặc d (ngày), ví dụ: 1m 10m 1h.');return}
    setCfg(s=>({...s,preset:'custom',steps:st,relearn:rl,grad:g,easy:e,cap:cp,minLapse:ml,startEase:Math.max(1.3,+form.startEase/100),easyBonus:Math.max(1,+form.easyBonus/100),hardMul:Math.max(1,+form.hardMul/100),ivlMod:Math.max(.1,+form.ivlMod/100),lapsePct:Math.max(0,Math.min(100,+form.lapsePct)),newPerDay:Math.max(1,+form.newPerDay||1)}));
    setMsg('Đã lưu cài đặt. Lịch mới áp dụng từ lần chấm tiếp theo.')};
  const F=(k,label,hint)=>html`<label>${label}<input id=${'f-'+k} value=${form[k]} onInput=${e=>setForm(f=>({...f,[k]:e.target.value}))}/>${hint?html`<span className="note">${hint}</span>`:null}</label>`;
  const exp=()=>{const s=JSON.stringify({v:2,cards,cfg});setIo(s);try{navigator.clipboard.writeText(s).then(()=>setMsg('Đã sao chép tiến độ.'),()=>setMsg('Hãy tự sao chép đoạn bên dưới.'))}catch(e){setMsg('Hãy tự sao chép đoạn bên dưới.')}};
  const imp=()=>{try{const o=JSON.parse(io);if(!o.cards)throw 0;setCards(o.cards);if(o.cfg)setCfg(c=>({...c,...o.cfg}));setMsg('Đã nhập tiến độ.')}catch(e){setMsg('Không đọc được dữ liệu, hãy dán đúng đoạn đã xuất.')}};
  return html`<div className="panel">
    <div><b>Chế độ có sẵn</b></div>
    <div className="row"><button className=${'btn'+(cfg.preset==='cram'?' pri':'')} onClick=${()=>applyPreset('cram')}>Thi gấp (mai thi)</button><button className=${'btn'+(cfg.preset==='normal'?' pri':'')} onClick=${()=>applyPreset('normal')}>Giống Anki mặc định</button></div>
    <div className="note">Thi gấp: câu sai gặp lại sau 1m → 10m → 1h, thuộc rồi cách 4 giờ, tối đa 2 ngày. Anki mặc định: 1m → 10m, thuộc rồi cách 1 ngày, bấm Dễ cách 4 ngày, sau đó nhân với ease (250%).</div>
    <div><b>Tùy chỉnh như Anki</b> <span className="note">(m = phút, h = giờ, d = ngày)</span></div>
    <div className="grid2">
      ${F('steps','Bước học (thẻ mới)','vd: 1m 10m 1h')}
      ${F('relearn','Bước học lại (khi quên)','vd: 10m')}
      ${F('grad','Khoảng cách khi thuộc (Được ở bước cuối)','vd: 1d')}
      ${F('easy','Khoảng cách khi bấm Dễ lần đầu','vd: 4d')}
      ${F('cap','Khoảng cách tối đa','vd: 36500d')}
      ${F('minLapse','Khoảng cách tối thiểu sau khi quên','vd: 1d')}
      ${F('lapsePct','Khoảng cách mới sau khi quên (% cũ)','Anki mặc định 0%')}
      ${F('startEase','Ease ban đầu (%)','Anki mặc định 250')}
      ${F('easyBonus','Thưởng khi Dễ (%)','130')}
      ${F('hardMul','Hệ số Khó (%)','120')}
      ${F('ivlMod','Hệ số khoảng cách (%)','100')}
      ${F('newPerDay','Thẻ mới mỗi ngày','')}
    </div>
    <div className="row"><button className="btn pri" onClick=${save}>Lưu cài đặt</button><span className="note">Hiện có ${counts.nw} thẻ chưa học.</span></div>
    <div className="row"><b>Thứ tự thẻ mới:</b>
      <label><input type="radio" name="ord" checked=${cfg.order==='random'} onChange=${()=>setCfg(s=>({...s,order:'random'}))}/> Ngẫu nhiên</label>
      <label><input type="radio" name="ord" checked=${cfg.order==='seq'} onChange=${()=>setCfg(s=>({...s,order:'seq'}))}/> Theo số câu</label></div>
    ${msg?html`<div className="note" role="status">${msg}</div>`:null}
    <div><b>Sao lưu / chuyển máy</b></div>
    <div className="row"><button className="btn" onClick=${exp}>Xuất tiến độ</button><button className="btn" onClick=${imp}>Nhập từ ô bên dưới</button></div>
    <textarea id="io" value=${io} onChange=${e=>setIo(e.target.value)} placeholder="Dán dữ liệu tiến độ vào đây để nhập"></textarea>
    <div><b>Xóa tiến độ</b></div>
    ${confirm?html`<div className="row"><span>Xóa toàn bộ lịch ôn?</span><button className="btn pri" onClick=${()=>{setCards({});setDay({d:today(),newSeen:0,done:0,ok:0});setConfirm(false);setMsg('Đã xóa tiến độ.')}}>Xóa</button><button className="btn" onClick=${()=>setConfirm(false)}>Hủy</button></div>`:
      html`<div><button className="btn" onClick=${()=>setConfirm(true)}>Xóa tiến độ…</button></div>`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById('app')).render(html`<${App}/>`);

</script>

</body></html>
