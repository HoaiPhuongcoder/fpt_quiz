<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: single card column (~42rem); stat strip on top, card in middle, rating bar under the answer */
:root{
  --bg:#F2F3F6; --surface:#FFFFFF; --ink:#1A1E26; --muted:#5A616E; --line:#D9DCE3;
  --accent:#A3242A; --accent-soft:#F7E7E8;
  --gold:#8A5D00; --gold-soft:#FBF0D3;
  --ok:#1E7547; --ok-soft:#E3F2E9; --bad:#B0431A; --bad-soft:#FBE8DF; --info:#2B5C9E; --info-soft:#E6EEF9;
  --f-display:"Literata", Georgia, serif;
  --f-body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121418; --surface:#1A1D23; --ink:#E6E7EA; --muted:#9BA2AE; --line:#2D3139;
  --accent:#EC6E73; --accent-soft:#3A2023; --gold:#E3B650; --gold-soft:#32280F;
  --ok:#5ECB8E; --ok-soft:#15301F; --bad:#F08B5E; --bad-soft:#3A2217; --info:#7EAAF0; --info-soft:#17243A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121418; --surface:#1A1D23; --ink:#E6E7EA; --muted:#9BA2AE; --line:#2D3139;
  --accent:#EC6E73; --accent-soft:#3A2023; --gold:#E3B650; --gold-soft:#32280F;
  --ok:#5ECB8E; --ok-soft:#15301F; --bad:#F08B5E; --bad-soft:#3A2217; --info:#7EAAF0; --info-soft:#17243A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);margin:0}
.wrap{max-width:42rem;margin:0 auto;padding-inline:16px;padding-block:18px 60px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-size:1.5rem;margin:0}
h1 span{color:var(--accent)}
.link{background:none;border:0;color:var(--muted);font:500 .9rem var(--f-body);cursor:pointer;text-decoration:underline;padding:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.75rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.stat.new b{color:var(--info)} .stat.learn b{color:var(--bad)} .stat.due b{color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 11px;font:500 .84rem var(--f-body);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-bottom:6px}
.pill{border-radius:999px;padding:1px 8px;font-weight:600}
.pill.new{background:var(--info-soft);color:var(--info)} .pill.learn{background:var(--bad-soft);color:var(--bad)} .pill.review{background:var(--ok-soft);color:var(--ok)}
.q{font-weight:600;font-size:1.05rem;margin:4px 0 12px}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:10px;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:9px 11px;font:inherit;font-size:.95rem;cursor:pointer}
.opt .k{font-weight:700;min-width:1.2em;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)} .opt.right .k{color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)} .opt.wrong .k{color:var(--bad)}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt:disabled{cursor:default}
.verdict{margin:14px 0 6px;font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.box{border-radius:10px;padding:9px 12px;margin:8px 0;font-size:.94rem}
.box b.t{display:block;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.why{background:var(--bg)} .why b.t{color:var(--muted)}
.trick{background:var(--gold-soft)} .trick b.t{color:var(--gold)}
.warn{background:var(--accent-soft)} .warn b.t{color:var(--accent)}
.sim{border:1px dashed var(--line)} .sim b.t{color:var(--info)}
.sim ul{margin:0;padding-left:1.1rem} .sim li{margin:4px 0} .sim .a{color:var(--ok);font-weight:600}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.rate button{border:1px solid var(--line);border-radius:9px;padding:7px 4px;background:var(--bg);color:var(--ink);font:600 .9rem var(--f-body);cursor:pointer;display:flex;flex-direction:column;align-items:center}
.rate button small{font-weight:500;color:var(--muted);font-size:.74rem;font-variant-numeric:tabular-nums}
.rate .again{border-color:var(--bad)} .rate .again.rec{background:var(--bad-soft)}
.rate .good.rec{background:var(--ok-soft);border-color:var(--ok)}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 13px;font:500 .9rem var(--f-body);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.empty{text-align:center;padding:26px 10px}
.empty h2{font-family:var(--f-display);margin:0 0 6px}
.note{font-size:.82rem;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0;display:grid;gap:10px}
.panel label{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel input[type=number]{width:5rem;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:.8rem ui-monospace,Menlo,monospace;padding:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kbd{font-size:.76rem;color:var(--muted);margin-top:10px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}}

.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;margin:12px 0}
.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:6px 8px;border-radius:7px;font:500 .88rem var(--f-body);cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:.9rem;max-width:calc(100% - 32px);z-index:9}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(7.5rem,1fr));gap:6px;margin:10px 0 0;font-size:.82rem}
.info div{background:var(--bg);border-radius:8px;padding:5px 8px}
.info b{display:block;font-variant-numeric:tabular-nums;font-size:.92rem}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums;vertical-align:top}
th{cursor:pointer;color:var(--muted);font-weight:600;background:var(--surface)}
td.qt{white-space:normal}
.btn.mini{padding:2px 7px;font-size:.78rem}
.fc{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:8px;margin:0 0 12px}
.fc div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.fc b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.fc span{font-size:.76rem;color:var(--muted)}
.bars{display:grid;gap:4px;margin-top:8px}
.bars .r{display:grid;grid-template-columns:6.5rem 1fr 2.5rem;gap:8px;align-items:center;font-size:.8rem}
.bars i{display:block;height:10px;background:var(--ok);border-radius:3px;min-width:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.grid2 label{display:grid;gap:3px;font-size:.86rem}
.grid2 input{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}

.c-new{color:var(--info)} .c-learn{color:var(--bad)} .c-due{color:var(--ok)}
.deck{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px;text-align:center;display:grid;gap:12px;justify-items:center}
.dcounts{display:flex;gap:28px}
.dcounts div{display:grid}
.dcounts b{font-size:2rem;font-variant-numeric:tabular-nums;line-height:1.1}
.dcounts span{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.btn.big{font-size:1.05rem;padding:11px 34px;border-radius:10px}
.study{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.sbar .cnt{display:flex;gap:12px;font-weight:700;font-variant-numeric:tabular-nums;font-size:1.05rem}
.sbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sinner{max-width:42rem;margin:0 auto;padding:16px 16px 24px}
.sfoot{border-top:1px solid var(--line);background:var(--surface);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.sfoot .rate{max-width:42rem;margin:0 auto}
.sfoot .rate button{padding:9px 4px;font-size:.95rem}
.sfoot .rate small{display:block}
.sfoot kbd{font:500 .7rem var(--f-body);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px}
.hint{text-align:center;color:var(--muted);font-size:.86rem;padding:8px 0}
.toast.st{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
</style>

<script>
const DATA=[{"n":1,"q":"Theo Hồ Chí Minh, \"Muốn xây dựng chủ nghĩa xã hội, trước hết cần có","o":[["A","con người xã hội chủ nghĩa\""],["B","khoa học xã hội tiên tiến\""],["C","công nông nghiệp hiện đại\""],["D","nền kinh tế phát triển\""]],"a":["A"],"c":3,"s":[625,2,99],"y":"Câu nguyên văn của Bác (Chương III, mục Động lực – con người): muốn xây dựng CNXH, trước hết cần có những con người XHCN.","t":"Thấy 'trước hết cần có' + CNXH → chọn CON NGƯỜI. Không chọn kinh tế, khoa học."},{"n":2,"q":"Theo Hồ Chí Minh, biện pháp nào quan trọng nhất trong xây dựng chủ nghĩa xã hội?","o":[["A","Tranh thủ tối đa sự giúp đỡ, viện trợ quốc tế"],["B","Kết hợp cải tạo xã hội cũ và xây dựng xã hội mới"],["C","Huy động các nguồn lực sẵn có trong dân"],["D","Kết hợp xây dựng và bảo vệ đất nước"]],"a":["B"],"c":3,"w":"Phân biệt với câu 3: 'quan trọng nhất' (kết hợp cải tạo và xây dựng) khác 'cơ bản nhất' (đem của dân, tài dân, sức dân làm lợi cho dân).","s":[3,1,61],"y":"Bác coi xây dựng CNXH là quá trình 'xây' đi đôi với 'chống': cải tạo xã hội cũ và xây dựng xã hội mới. Đề cũ coi đây là biện pháp quan trọng nhất.","t":"Hỏi 'QUAN TRỌNG NHẤT' → kết hợp cải tạo cũ + xây dựng mới. Hỏi 'CƠ BẢN NHẤT' (câu 3) → đem của dân, tài dân, sức dân làm lợi cho dân."},{"n":3,"q":"Theo Hồ Chí Minh, biện pháp cơ bản nhất để xây dựng chủ nghĩa xã hội là:","o":[["A","Đem của dân, tài dân, sức dân làm lợi cho dân"],["B","Nhà nước phải ban phát từ trên xuống"],["C","Phải dựa vào sự giúp đỡ của các nước xã hội chủ nghĩa"],["D","Phải tự lực cánh sinh, dựa vào sức mình là chính"]],"a":["A"],"c":3,"w":"Phân biệt với câu 2: 'cơ bản nhất' khác 'quan trọng nhất'.","s":[2,1],"y":"CNXH là công trình tập thể của nhân dân; động lực quyết định là nội lực, là dân. Nên biện pháp cơ bản nhất là đem của dân, tài dân, sức dân làm lợi cho dân.","t":"'CƠ BẢN NHẤT' → của dân, tài dân, sức dân. Đừng nhầm với 'tự lực cánh sinh' (đó là nguyên tắc đoàn kết quốc tế)."},{"n":4,"q":"Nói về đạo đức cách mạng Hồ Chí Minh chi rõ: \"Vì muốn giải phóng cho dân tộc, giải phóng cho loài người là một công việc to tát, mà tự mình không có đạo đức, không có căn bản, tự mình đã hủ hóa, xấu xa thì còn làm nổi việc gì?\". Câu nói trên của Hồ Chí Minh đề cập đến vấn đề gì sau đây ?","o":[["A","Vai trò và sức mạnh của đạo đức"],["B","Chuẩn mực và nguyên tắc xây dựng đạo đức mới"],["C","Nguyên tắc xây dựng đạo đức mới"],["D","Các phẩm chất đạo đức mới"]],"a":["A"],"c":6,"s":[],"y":"Trích 'Sửa đổi lối làm việc' (1947): ví đạo đức như gốc cây, nguồn sông; không có đạo đức thì không làm nổi việc gì → nói về vai trò, sức mạnh của đạo đức.","t":"Câu trích có 'không có đạo đức… làm nổi việc gì / gốc / nguồn' → VAI TRÒ của đạo đức. Chuẩn mực = trung, hiếu, cần kiệm…; nguyên tắc = nói đi đôi làm, xây-chống, tu dưỡng."},{"n":5,"q":"Lực lượng đoàn kết quốc tế theo hồ chí minh cần phải đoàn kết với","o":[["A","Giai cấp công nhân, lực lượng xhcn, phong trào cộng sản và công nhân quốc tế,với các dân tộc thuộc địa bị áp bức và các lực lượng tiến bộ trên thế giới."],["B","Giai cấp nông dân, lực lượng xhcn, phong trào cộng sản và công nhân quốc tế,với các dân tộc thuộc địa bị áp bức và các lực lượng tiến bộ trên thế giới."],["C","Giai cấp lao động, lực lượng xhcn, phong trào cộng sản và công nhân quốc tế,với các dân tộc thuộc địa bị áp bức và các lực lượng tiến bộ trên thế giới."]],"a":["A"],"c":5,"s":[149,206],"y":"Lực lượng đoàn kết quốc tế: phong trào cộng sản – công nhân quốc tế, lực lượng XHCN, dân tộc bị áp bức, lực lượng tiến bộ. Đứng đầu là giai cấp công nhân.","t":"Các phương án chỉ khác chữ đầu: chọn GIAI CẤP CÔNG NHÂN (không phải nông dân, lao động)."},{"n":6,"q":"Theo Hồ Chí Minh, căn bệnh nào là một thứ vi trùng rất độc, đẻ ra hàng trăm thứ bệnh nguy hiểm?","o":[["A","Chủ nghĩa tư bản"],["B","Chủ nghĩa cá nhân"],["C","Sự lười biếng"],["D","Thói quen và truyền thống lạc hậu"]],"a":["B"],"c":6,"s":[614,107,582],"y":"Bác gọi chủ nghĩa cá nhân là 'vi trùng rất độc' đẻ ra tham lam, kiêu ngạo, háo danh, vô kỷ luật…","t":"'Vi trùng', 'bệnh mẹ', 'kẻ thù hung ác của CNXH', 'giặc trong lòng' → đều là CHỦ NGHĨA CÁ NHÂN."},{"n":7,"q":"Nguyên tắc cơ bản nào sau đây cần phải quán triệt trong nghiên cứu tư tưởng hồ chí minh?","o":[["A","quan điểm kế thừa và phát triển"],["B","quan điểm kế thừa và toàn diện"],["C","quan điểm cách mạng và cụ thể"],["D","quan điểm toàn diện và cụ thể"]],"a":["A"],"c":1,"s":[91,587,339],"y":"Một trong 5 nguyên tắc phương pháp luận (Chương I): tính đảng–khoa học; lý luận–thực tiễn; lịch sử–cụ thể; toàn diện–hệ thống; kế thừa–phát triển.","t":"Nhớ 5 cặp. Phương án nào trùng 1 trong 5 cặp là đúng."},{"n":8,"q":"Chọn câu trả lời đúng nhất với tư tưởng Hồ Chí Minh về vai trò của đại đoàn kết dân tộc:","o":[["A","Đại đoàn kết dân tộc là vấn đề chiến lược"],["B","Đại đoàn kết dân tộc là vấn đề sách lược"],["C","Đại đoàn kết dân tộc là thủ đoạn chính trị"],["D","Đại đoàn kết dân tộc là phương pháp chính trị"]],"a":["A"],"c":5,"s":[126,125,471],"y":"Chương V: đại đoàn kết là vấn đề CHIẾN LƯỢC, quyết định thành công, không phải sách lược.","t":"Có chữ 'sách lược', 'thủ đoạn' → sai. Chọn 'chiến lược'."},{"n":9,"q":"Phạm vi vận dụng tư tưởng Hồ Chí Minh:","o":[["A","Đối với cách mạng Việt Nam"],["B","Đối với các dân tộc đang bị xâm lược và áp bức trên toàn thế giới"],["C","Đối với mọi quốc gia, dân tộc"],["D","Đối với cách mạng giải phóng dân tộc ở Việt Nam"]],"a":["B"],"c":1,"s":[],"y":"Tư tưởng HCM có ý nghĩa với cả các dân tộc bị áp bức trên thế giới (giá trị với nhân loại, Chương II).","t":"Phạm vi rộng nhất (toàn thế giới, dân tộc bị áp bức) thường đúng."},{"n":10,"q":"Hồ Chí Minh ví chính sách đối với Pháp sau khi giành độc lập như chính sách","o":[["A","Tạm hòa"],["B","Câu tiễn"],["C","Tạm thời"]],"a":["B"],"c":3,"s":[],"y":"Đề cũ: sau 1945 Bác ví sách lược hòa hoãn với Pháp như 'Câu Tiễn' nằm gai nếm mật (nhân nhượng có nguyên tắc). Không có trong GT 2019.","t":"Hòa hoãn để chờ thời → Câu Tiễn."},{"n":11,"q":"Nguyên tắc chung của Mặt trận dân tộc thống nhất được Hồ Chí Minh xác định cụ thể phù hợp là","o":[["A","Độc lập, tự do"],["B","Tất cả các phương án"],["C","Đoàn kết chặt chẽ, lâu dài, thật sự, chân thành"]],"a":["C"],"c":5,"s":[474,277,174],"y":"Nguyên tắc 3 của Mặt trận: đoàn kết lâu dài, chặt chẽ, thật sự, chân thành, thân ái giúp nhau tiến bộ.","t":"Thấy bộ chữ 'lâu dài, chặt chẽ, thật sự, chân thành' → đúng."},{"n":12,"q":"Cách diễn đạt nào dưới đây là của Hồ Chí Minh?","o":[["A","Lý luận mà không liên hệ với thực tiễn là lý luận mù quáng"],["B","Lý luận mà không liên hệ với thực tiễn là lý luận suông"],["C","Lý luận mà không liên hệ với thực tiễn là lý luận giáo điều"],["D","Lý luận mà không liên hệ với thực tiễn là lý luận trống rỗng"]],"a":["B"],"c":1,"s":[],"y":"Nguyên tắc thống nhất lý luận – thực tiễn: lý luận không gắn thực tiễn là lý luận suông.","t":"'Lý luận suông' gắn với 'không liên hệ thực tiễn'."},{"n":13,"q":"Điền từ còn thiếu vào chỗ trống để hoàn thành luận điểm của Hồ Chí Minh khi đề cập đến nguyên tắc phương pháp luận \"Thống nhất lý luận và thực tiễn\" trong nghiên cứu môn học Tư tưởng Hồ Chí Minh: \"Thực tiễn không có lý luận hướng dẫn thì thành thực tiễn mù quáng, dễ mắc bệnh...; lý luận mà không liên hệ với thực tiễn là lý luận suông\".","o":[["A","Quan liêu"],["B","Tham ô"],["C","Chủ quan"],["D","Lãng phí"]],"a":["C"],"c":1,"s":[],"y":"Vế đối xứng: thực tiễn thiếu lý luận → mù quáng, mắc bệnh CHỦ QUAN; lý luận thiếu thực tiễn → suông.","t":"Thực tiễn không có lý luận = chủ quan/kinh nghiệm; lý luận không có thực tiễn = suông."},{"n":14,"q":"Một trong những giá trị của văn hoá phương Tây được Hồ Chí Minh tiếp thu để hình thành tư tưởng của mình là:","o":[["A","Tư tưởng văn hoá dân chủ và cách mạng của cách mạng Pháp và cách mạng Mỹ"],["B","Những mặt tích cực của Nho Giáo"],["C","Triết học cổ điển Đức"],["D","Kinh tế chính trị cổ điển Anh"]],"a":["A"],"c":2,"s":[345,192],"y":"Từ phương Tây Bác tiếp thu tư tưởng dân chủ, nhân quyền của cách mạng Pháp (1789, 1791) và Mỹ (1776).","t":"Phương Tây → Pháp, Mỹ, dân chủ, nhân quyền. Phương Đông → Nho, Phật, Lão, Tam dân."},{"n":15,"q":"Một trong những giá trị nào dưới đây dẫn đến hình thành tư tưởng Hồ Chí Minh?","o":[["A","Chủ nghĩa yêu nước"],["B","Chủ nghĩa xã hội"],["C","Chủ nghĩa nhân đạo"],["D","Chủ nghĩa nhân văn"]],"a":["A"],"c":2,"s":[345,100],"y":"Chủ nghĩa yêu nước là giá trị xuyên suốt, điểm xuất phát hình thành tư tưởng HCM.","t":"Hỏi 'giá trị/truyền thống' dẫn đến hình thành → YÊU NƯỚC. Hỏi 'quyết định' → Mác-Lênin."},{"n":16,"q":"Hồ Chí Minh vạch ra mục tiêu của cách mạng giải phóng dân tộc thuộc địa là gì?","o":[["A","Đánh đổ ách thống trị của chủ nghĩa thực dân, giành độc lập dân tộc và thiết lập chính quyền của nhân dân"],["B","Đánh đổ ách thống trị của chủ nghĩa thực dân, giành độc lập dân tộc và thiết lập chính quyền về tay người lao động"],["C","Đánh đổ ách thống trị của chủ nghĩa thực dân, giành độc lập dân tộc và thiết lập chính quyền về tay lực lượng cách mạng"],["D","Đánh đổ ách thống trị của chủ nghĩa thực dân, giành độc lập dân tộc và thiết lập chính quyền của công nông"]],"a":["A"],"c":3,"s":[228,323,609],"y":"Mục tiêu cách mạng thuộc địa: đánh đổ thực dân, giành độc lập, lập chính quyền nhân dân.","t":"Đáp án dài nhất, đủ 3 vế (đánh đổ – độc lập – chính quyền nhân dân)."},{"n":17,"q":"Theo Hồ Chí Minh, tính chất và nhiệm vụ hàng đầu của cách mạng ở thuộc địa là gì?","o":[["A","Giải phóng nhân loại"],["B","Giải phóng thế giới"],["C","Giải phóng giai cấp"],["D","Giải phóng dân tộc"]],"a":["D"],"c":3,"s":[372,151,228],"y":"Ở thuộc địa, giải phóng dân tộc là trước hết, trên hết.","t":"Thuộc địa + nhiệm vụ hàng đầu → GIẢI PHÓNG DÂN TỘC."},{"n":18,"q":"Theo Hồ Chí Minh, muốn phát huy tinh thần đoàn kết Đảng phải","o":[["A","Có chính sách mặt trận dân tộc đúng đắn"],["B","Có chính sách đúng đắn thu hút quần chúng nhân dân"],["C","Có chính sách dân chủ đúng đắn"]],"a":["A"],"c":5,"s":[473,637,482],"y":"Muốn đoàn kết rộng rãi, Đảng phải có chính sách Mặt trận đúng đắn.","t":"Đoàn kết + Đảng phải → chính sách MẶT TRẬN."},{"n":19,"q":"Tư tưởng Hồ Chí Minh hình thành trên cơ sở","o":[["A","Vận dụng và phát triển sáng tạo chủ nghĩa Mác- Lênin"],["B","Tiếp thu toàn bộ chủ nghĩa Mác-Lênin"],["C","Tiếp thu một bộ phận của chủ nghĩa Mác-Lênin"],["D","Vận dụng hoàn toàn chủ nghĩa Mác - Lênin vào hoàn cảnh của Việt Nam"]],"a":["A"],"c":2,"s":[128],"y":"Định nghĩa ĐH XI: tư tưởng HCM là kết quả vận dụng và phát triển sáng tạo CN Mác-Lênin vào điều kiện nước ta.","t":"'Hình thành trên cơ sở' → vận dụng, phát triển SÁNG TẠO Mác-Lênin."},{"n":20,"q":"Chọn phương án trả lời không đúng với tư tưởng Hồ Chí Minh về nhà nước vì dân?","o":[["A","Phục vụ nhân dân"],["B","Chăm lo mọi mặt đời sống nhân dân"],["C","Do dân làm chủ, tổ chức nên"],["D","Đem lại lợi ích cho dân"]],"a":["C"],"c":4,"s":[262,196],"y":"'Do dân làm chủ, tổ chức nên' là nội dung nhà nước DO dân, không phải VÌ dân.","t":"Của dân = quyền lực thuộc dân; Do dân = dân lập nên, dân làm chủ; Vì dân = phục vụ lợi ích dân."},{"n":21,"q":"Hồ Chí Minh đã nêu quan điểm về xây dựng một nền văn hóa mới là","o":[["A","Xây dựng tâm lý, xây dựng luân lý"],["B","Xây dựng tâm lý, xây dựng luân lý, xây dựng xã hội"],["C","Xây dựng tâm lý, xây dựng luân lý, xây dựng xã hội, xây dựng chính trị"],["D","Xây dựng tâm lý, xây dựng luân lý, xây dựng xã hội, xây dựng chính trị, xây dựng kinh tế"]],"a":["D"],"c":6,"s":[464,204],"y":"8-1943 Bác nêu 5 điểm xây dựng văn hóa dân tộc: tâm lý, luân lý, xã hội, chính trị, kinh tế.","t":"Nhớ '5 điểm: Tâm – Luân – Xã – Chính – Kinh'."},{"n":22,"q":"Con người trong quan điểm của Hồ Chí Minh được nhìn nhận như một:","o":[["A","Chỉnh thể"],["B","Tế bào"],["C","Xã hội"],["D","Cộng đồng"]],"a":["A"],"c":6,"s":[],"y":"Con người là một chỉnh thể thống nhất trí lực, tâm lực, thể lực.","t":"Con người được nhìn như một → CHỈNH THỂ."},{"n":23,"q":"Luận điểm: \"Cách mệnh trước hết phải có cái gì? Trước hết phải có đảng cách mệnh, để trong thì vận động và tổ chức dân chúng, ngoài thì liên lạc với dân tộc bị áp bức và vô sản giai cấp ở mọi nơi. Đảng có vững thì cách mạng mới thành công, cũng như người cầm lái có vững thuyền mới chạy\" được trích từ tác phẩm nào của Hồ Chí Minh?","o":[["A","Bản án chế độ thực dân Pháp"],["B","Đường kách mệnh"],["C","Bản án chế độ thực dân Pháp"],["D","Thường thức chính trị"]],"a":["B"],"c":4,"s":[24,47],"y":"Câu 'Cách mệnh trước hết phải có… đảng cách mệnh… người cầm lái' trong Đường cách mệnh (1927).","t":"'Người cầm lái', 'cách mệnh trước hết phải có' → Đường cách mệnh."},{"n":24,"q":"Luận điểm: \"Cách mệnh An Nam cũng là một bộ phận trong cách mệng thế giới. Ai làm cách mệnh trong thế giới đều là đồng chí của dân An Nam cả\" được trích từ tác phẩm nào của Hồ Chí Minh?","o":[["A","Đông Dương (1923-1924)"],["B","Bản án chế dộ thực dân Pháp"],["C","Đường Kách mệnh"],["D","Tuyên ngôn Độc lập"]],"a":["C"],"c":4,"s":[23,47],"y":"'Cách mệnh An Nam là một bộ phận trong cách mệnh thế giới' cũng ở Đường cách mệnh.","t":"Chữ 'cách mệnh' (cách viết cũ) + 1927 → Đường cách mệnh."},{"n":25,"q":"Chọn phương án trả lời đúng nhất?","o":[["A","Chủ nghĩa Mác - Lênin là nền tảng tư tưởng, kim chỉ nam cho hành động của Đảng"],["B","Tư tưởng Hồ Chí Minh là nền tảng tư tưởng, kim chỉ nam cho hành động của Đảng"],["C","Cùng với chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh là nền tảng tư tưởng và kim chỉ nam cho hành động của Đảng ta"]],"a":["C"],"c":1,"s":[446,248,51],"y":"ĐH VII khẳng định: CN Mác-Lênin và tư tưởng HCM là nền tảng tư tưởng, kim chỉ nam.","t":"Luôn đi đôi: 'cùng với CN Mác-Lênin'. Phương án tách riêng hay thay thế Mác-Lênin → sai."},{"n":26,"q":"Theo Tư tưởng Hồ Chí Minh, văn hoá có mấy chức năng chủ yếu?","o":[["A","Hai"],["B","Ba"],["C","Bốn"],["D","Năm"]],"a":["B"],"c":6,"w":"Giáo trình 2019 không nêu 'văn hóa có mấy chức năng'. Câu này theo giáo trình cũ.","s":[],"y":"Đề cũ (GT cũ): văn hóa có 3 chức năng – bồi dưỡng tư tưởng tình cảm, nâng cao dân trí, bồi dưỡng phẩm chất lối sống. GT 2019 không nêu.","t":"Chức năng văn hóa = BA."},{"n":27,"q":"Theo Hồ Chí Minh, để đánh bại các thế lực đế quốc thực dân chỉ có tinh thần yêu nước là chưa đủ, cách mạng muốn đến nơi, phải tập hợp được tất cả mọi lực lượng có thể tập hợp, xây dựng được.","o":[["A","Chính sách dân tộc phù hợp"],["B","Khối đại đoàn kết dân tộc bền vững"],["C","Chương trình tập hợp lực lượng đoàn kết rộng rãi"]],"a":["B"],"c":3,"s":[],"y":"Muốn đánh bại đế quốc phải tập hợp mọi lực lượng → khối đại đoàn kết dân tộc.","t":"Tập hợp mọi lực lượng → ĐẠI ĐOÀN KẾT."},{"n":28,"q":"Theo Hồ Chí Minh, mục đích của chủ nghĩa xã hội là.","o":[["A","Xây dựng nền kinh tế hiện đại, có sức tăng trưởng cao."],["B","Không ngừng nâng cao đời sống vật chất và tinh thần của nhân dân"],["C","Phát triển mạnh mẽ khoa học - kỹ thuật"],["D","Bảo đảm quyền làm chủ của nhân dân lao động"]],"a":["B"],"c":3,"s":[29,555,582],"y":"Mục đích CNXH: không ngừng nâng cao đời sống vật chất và tinh thần của nhân dân.","t":"Mục đích/mục tiêu CNXH → nâng cao đời sống nhân dân (lao động)."},{"n":29,"q":"Theo Hồ Chí Minh, mục tiêu tổng quát của chủ nghĩa xã hội là gì?","o":[["A","Một nền kinh tế hiện đại, khoa học kỹ thuật tiên tiến"],["B","Không ngừng cải thiện và nâng cao đời sống của nhân dân lao động"],["C","Phát triển mạnh mẽ khoa học - kỹ thuật, tư tưởng văn hóa tiến bộ"],["D","Bảo đảm quyền làm chủ của nhân dân lao động"]],"a":["B"],"c":3,"s":[28,555,161],"y":"Mục tiêu tổng quát của CNXH: cải thiện, nâng cao đời sống nhân dân lao động.","t":"Giống câu 28, có thêm 'nhân dân lao động'."},{"n":30,"q":"Theo Hồ Chí Minh, đánh giá cán bộ phải:","o":[["A","Tiến hành thường xuyên"],["B","Khách quan, trung thực"],["C","Phải tự biết mình, biết người"],["D","Phải đủ trong sạch"]],"a":["B"],"c":4,"s":[],"y":"Công tác cán bộ: phải hiểu và đánh giá đúng cán bộ (khách quan, trung thực).","t":"Đánh giá cán bộ → khách quan."},{"n":31,"q":"Hãy chọn phương án trả lời đúng nhất: Lòng khoan dung độ lượng ở Hồ Chí Minh không phải là một sách lược, một thủ đoạn chính trị mà là sự nối tiếp và phát triển của :","o":[["A","Chủ nghĩa yêu nước"],["B","Chủ nghĩa dân tộc chân chính"],["C","Truyền thống nhân ái, bao dung của dân tộc"],["D","Mục tiêu cách mạng"]],"a":["C"],"c":5,"s":[],"y":"Lòng khoan dung của Bác là sự tiếp nối truyền thống nhân ái, bao dung của dân tộc.","t":"Khoan dung → truyền thống dân tộc."},{"n":32,"q":"Trong quan hệ quốc tế, Hồ Chí Minh nhấn mạnh: phải có thực lực, thực lực là cái (...), ngoại giao là cái tiếng, (....) có to tiếng mới lớn.","o":[["A","Chiêng"],["B","Trống"],["C","Kèn"],["D","Đàn"]],"a":["A"],"c":5,"s":[],"y":"'Thực lực là cái chiêng, ngoại giao là cái tiếng; chiêng có to tiếng mới lớn'.","t":"Chiêng – tiếng."},{"n":33,"q":"Hồ Chí Minh nhấn mạnh mục đích của Đảng Lao động Việt Nam là","o":[["A","Liên kết toàn dân, chống giặc ngoại xâm"],["B","Đoàn kết đoàn kết đại đoàn kết"],["C","Đoàn kết toàn dân, phụng sự tổ quốc"],["D","Đoàn kết dân tộc, phụng sự tổ quốc"]],"a":["C"],"c":4,"s":[239,126],"y":"3-3-1951, mục đích Đảng Lao động VN: 'Đoàn kết toàn dân, phụng sự Tổ quốc'.","t":"Tám chữ: ĐOÀN KẾT TOÀN DÂN, PHỤNG SỰ TỔ QUỐC."},{"n":34,"q":"Đâu là nguyên tắc xây dựng đạo đức mới trong tư tưởng hồ chí minh","o":[["A","phải tu dưỡng đạo đức suốt đời"],["B","phải tu dưỡng đạo đức thường xuyên"],["C","phải tu dưỡng đạo đức hằng ngày"]],"a":["A"],"c":6,"s":[35,36,552],"y":"3 nguyên tắc xây dựng đạo đức: nói đi đôi làm/nêu gương; xây đi đôi chống; tu dưỡng suốt đời.","t":"Nguyên tắc ≠ chuẩn mực. Thấy 'tu dưỡng suốt đời' → nguyên tắc."},{"n":35,"q":"Đâu là nguyên tắc xây dựng đạo đức mới trong tư tưởng hồ chí minh","o":[["A","nói đi đôi với làm, phải nêu gương về đạo đức"],["B","nói đi đôi với làm, phải nêu gương về lối sống"],["C","nói đi đôi với làm, phải nêu gương về học tập"]],"a":["A"],"c":6,"s":[36,34,552],"y":"Nguyên tắc 1 (quan trọng bậc nhất): nói đi đôi với làm, nêu gương.","t":"Nói – làm – nêu gương → nguyên tắc."},{"n":36,"q":"Đâu là nguyên tắc xây dựng đạo đức mới trong tư tưởng hồ chí minh","o":[["A","xây đi đôi với chống"],["B","xây đi đôi với bảo vệ"],["C","xây đi đôi với gia cố"]],"a":["A"],"c":6,"s":[35,34,552],"y":"Nguyên tắc 2: xây đi đôi với chống, lấy xây làm chính.","t":"Xây – chống → nguyên tắc."},{"n":37,"q":"Trong tư tưởng Hồ Chí Minh, Mặt trận dân tộc thống nhất càng rộng rãi, sức mạnh của khối liên minh công nông trí thức càng:","o":[["A","Suy yếu và ngược lại."],["B","Được tăng cường và ngược lại."],["C","Gắn kết và ngược lại"],["D","Thu hẹp và ngược lại"]],"a":["B"],"c":5,"s":[479],"y":"Mặt trận càng rộng thì liên minh công-nông-trí càng mạnh, và ngược lại (quan hệ hai chiều).","t":"Chọn 'được tăng cường và ngược lại'."},{"n":38,"q":"Thực chất của giải phóng giai cấp theo tư tưởng Hồ Chí Minh là gì?","o":[["A","Xóa bỏ các giai cấp bóc lột với tính cách là giai cấp thống trị xã hội"],["B","Tiêu diệt cá nhân những con người thuộc các giai cấp bóc lột"],["C","Không chủ trương thủ tiêu giai cấp bóc lột thống trị xã hội"],["D","Xóa bỏ triệt tiêu các giai cấp thuộc về xã hội cũ"]],"a":["A"],"c":3,"s":[],"y":"Giải phóng giai cấp là xóa bỏ áp bức bóc lột giai cấp, xóa bỏ giai cấp bóc lột thống trị.","t":"Giai cấp → xóa giai cấp bóc lột."},{"n":39,"q":"Tư tưởng Hồ Chí Minh về cách mạng Việt Nam được hình thành về cơ bản trong thời kỳ nào?","o":[["A","Từ 1911 den 1920"],["B","Từ 1920 đến 1930"],["C","Từ 1921 đến 1930"],["D","Từ 1930 đến 1945"]],"a":["C"],"c":2,"w":"Giáo trình 2019 ghi 31/12/1920 – 3/2/1930; đề cũ ghi 1921–1930: cùng một thời kỳ.","s":[268,59],"y":"Thời kỳ hình thành cơ bản tư tưởng về cách mạng VN: GT 2019 ghi 31/12/1920 – 3/2/1930 (đề cũ: 1921–1930).","t":"Hình thành CƠ BẢN = 1921–1930 (từ sau Tua đến lập Đảng)."},{"n":40,"q":"Trong tác phẩm \"Nâng cao đạo đức cách mạng, quét sạch chủ nghĩa cá nhân\" viết trên báo 1969, Hồ Chí Minh ví chủ nghĩa cá nhân như:","o":[["A","Bệnh mẹ"],["B","Bệnh nguy hiểm"],["C","Giặc ngoại xâm"],["D","Bệnh cần loại bỏ"]],"a":["A"],"c":6,"s":[],"y":"Bài 1969 gọi chủ nghĩa cá nhân là 'bệnh mẹ' đẻ ra các bệnh khác.","t":"Bệnh mẹ = chủ nghĩa cá nhân."},{"n":41,"q":"Hồ Chí Minh cho rằng giai cấp địa chủ ở Việt Nam","o":[["A","Là giai cấp phản động"],["B","Là giai cấp tiên tiến"],["C","Là giai cấp không hoàn toàn phản động"]],"a":["C"],"c":3,"s":[42],"y":"Sách lược vắn tắt 1930: trung, tiểu địa chủ chưa rõ mặt phản cách mạng thì lợi dụng → không hoàn toàn phản động.","t":"Địa chủ → không hoàn toàn phản động / có thể lợi dụng."},{"n":42,"q":"Hồ chí minh cho rằng giai cấp địa chủ ở việt nam","o":[["A","Là giai Cấp phản động"],["B","Là giai cấp tiên tiến"],["C","Có thể lợi dụng"],["D","Cần phải loại bỏ"]],"a":["C"],"c":3,"s":[41],"y":"Như câu 41: với trung, tiểu địa chủ thì lợi dụng, ít ra làm họ trung lập.","t":"Địa chủ → LỢI DỤNG."},{"n":43,"q":"Vấn đề dân tộc trong tư tưởng Hồ Chí Minh là sự kết hợp nhuần nhuyễn:","o":[["A","Dân tộc với giai cấp."],["B","Độc lập dân tộc và chủ nghĩa xã hội."],["C","Chủ nghĩa yêu nước với chủ nghĩa quốc tế."],["D","Tất cả các phương án."]],"a":["D"],"c":3,"s":[290,481,367],"y":"Vấn đề dân tộc kết hợp dân tộc–giai cấp, độc lập–CNXH, yêu nước–quốc tế.","t":"Có 'Tất cả các phương án' + các vế đều là cặp kết hợp → chọn tất cả."},{"n":44,"q":"Theo hồ chí minh, ngoài lợi ích của giai cấp, của nhân dân và toàn thể dân tộc việt nam, đảng:","o":[["A","không còn lợi ích nào khác"],["B","còn vì lợi ích của mình"],["C","còn vì lợi ích của nhà nước"],["D","Còn vì lợi ích của cá nhân"]],"a":["A"],"c":4,"s":[484],"y":"'Ngoài lợi ích của dân tộc, của Tổ quốc thì Đảng không có lợi ích gì khác'.","t":"Đảng không có lợi ích riêng."},{"n":45,"q":"Hồ Chí Minh ví tuổi trẻ như:","o":[["A","Mùa xuân của xã hội"],["B","Mùa xuân của đất nước"],["C","Mùa xuân của Đảng"],["D","Mùa xuân của Nhà nước"]],"a":["A"],"c":6,"s":[],"y":"Bác ví tuổi trẻ là mùa xuân của xã hội.","t":"Tuổi trẻ = mùa xuân; trẻ em = búp trên cành."},{"n":46,"q":"Hồ Chí Minh lần đầu tiên đã đưa ra một định nghĩa về văn hoá trong tác phẩm nào?","o":[["A","\"Bản án chế độ thực dân Pháp\""],["B","\"Đường Kách mệnh\""],["C","\"Nhật ký trong tù\""],["D","\"Sửa đổi lối làm việc\""]],"a":["C"],"c":6,"s":[],"y":"Định nghĩa văn hóa 8-1943 viết trong nhà tù Tưởng (gắn với Nhật ký trong tù).","t":"Văn hóa 1943 → trong tù → Nhật ký trong tù."},{"n":47,"q":"Các bài giảng của Nguyễn Ái Quốc tại các lớp huấn luyện cán bộ tuyên truyền của hội Liên hiệp các dân tộc bị áp bức bóc lột lập hợp lại và xuất bản thành tác phẩm gì?","o":[["A","Bản án chế độ thực dân Pháp"],["B","Lênin và Phương Đông"],["C","Con Rồng tre"],["D","Đường Kách mệnh"]],"a":["D"],"c":4,"s":[23,24],"y":"Bài giảng ở Quảng Châu cho lớp huấn luyện được in thành Đường cách mệnh (1927).","t":"Bài giảng lớp huấn luyện → Đường cách mệnh."},{"n":48,"q":"Trong quan điểm của hồ chí minh về bản chất của nhà nước có sự thống nhất giữa bản chất giai cấp công nhân với:","o":[["A","tính nhân dân và tính dân tộc"],["B","tính xã hội chủ nghĩa và tính dân tộc"],["C","tính nhân dân và tính xã hội chủ nghĩa"]],"a":["A"],"c":4,"s":[446,491],"y":"Bản chất giai cấp công nhân của Nhà nước thống nhất với tính nhân dân và tính dân tộc.","t":"GCCN + NHÂN DÂN + DÂN TỘC."},{"n":49,"q":"Theo Hồ Chí Minh, Đại đoàn kết dân tộc là nhiệm vụ hàng đầu của Đảng, đồng thời cũng là nhiệm vụ hàng đầu của:","o":[["A","Mọi giai đoạn cách mạng."],["B","Toàn quân."],["C","Toàn dân."]],"a":["C"],"c":5,"s":[273,126,151],"y":"Đại đoàn kết là nhiệm vụ hàng đầu của Đảng và của toàn dân tộc.","t":"Đảng và TOÀN DÂN."},{"n":50,"q":"Trong các luận điểm sau đây về văn hóa, luận điểm nào Hồ Chí Minh nói về tính chất của nền văn hóa?","o":[["A","Phải nâng cao trình độ văn hóa của nhân dân"],["B","Phải xây dựng một nền văn hóa dân tộc, khoa học và đại chúng"],["C","Văn hóa cũng là một mặt trận"],["D","Xây dựng chính trị dân quyền"]],"a":["B"],"c":6,"s":[113,133],"y":"Tính chất nền văn hóa mới: dân tộc, khoa học, đại chúng.","t":"Tính chất → DÂN TỘC – KHOA HỌC – ĐẠI CHÚNG."},{"n":51,"q":"Chọn phương án trả lời đúng với một trong những giai đoạn hình thành và phát triển tư tưởng hồ c  về xây dựng nhà nước của Hồ Chí Minh và các bậc tiền nhân trong lịch sử là:","o":[["A","Dựa vào dân"],["B","Dựa vào bạo lực vũ trang"],["C","Dựa vào đạo đức cách mạng"],["D","Dựa vào tài năng, trí tuệ, phán đoán"]],"a":["A"],"c":4,"s":[308],"y":"Điểm giống tiền nhân: dựa vào dân ('nước lấy dân làm gốc').","t":"Giống → dựa vào dân; khác → con đường cứu nước (câu 308)."},{"n":121,"q":"Nguyễn Ái Quốc đến Liên Xô lần đầu tiên học tại trường nào?","o":[["A","Trường quốc tế Lênin"],["B","Đại học Phương Đông"],["C","Viện nghiên cứu các vấn đề dân tộc và thuộc địa"],["D","Đại học Liên Xô"]],"a":["B"],"c":2,"s":[331],"y":"Lần đầu tới Liên Xô (1923) Bác học Đại học Phương Đông.","t":"Liên Xô 1923 → ĐH Phương Đông; 1934 → Trường Quốc tế Lênin."},{"n":122,"q":"Trong tư tưởng Hồ Chí Minh, Quản lý nhà nước là quản lý bằng bộ máy, bằng pháp luật và bằng nhiều biện pháp khác nhau trong đó quan trọng bậc nhất là:","o":[["A","Hiến pháp"],["B","Quyền lực"],["C","Mệnh lệnh"],["D","Hình phạt"]],"a":["A"],"c":4,"s":[],"y":"Quản lý nhà nước quan trọng bậc nhất bằng Hiến pháp (pháp luật).","t":"Quan trọng nhất → HIẾN PHÁP và pháp luật."},{"n":123,"q":"Luận điểm: \"Bồi dưỡng thế hệ cách mạng cho đời sau là một việc rất quan trọng và rất cần thiết\" được trích từ bài viết/ bài nói nào của Hồ Chí Minh?","o":[["A","Đường Kách mệnh"],["B","Cần kiệm liêm chính"],["C","Di chúc"],["D","Bài nói chuyện tại Lớp bồi dưỡng cán bộ về công tác mặt trận"]],"a":["C"],"c":6,"s":[579],"y":"Di chúc: 'Bồi dưỡng thế hệ cách mạng cho đời sau là việc rất quan trọng và rất cần thiết'.","t":"Thế hệ đời sau → Di chúc."},{"n":124,"q":"Trong tư tưởng Hồ Chí Minh, đại đoàn kết dân tộc phải biến thành sức mạnh vật chất, trở thành lực lượng vật chất có tổ chức. Tổ chức đó chính là:","o":[["A","Đoàn thể chính trị quần chúng."],["B","Đảng Cộng sản Việt Nam."],["C","Mặt trận dân tộc thống nhất."],["D","Đoàn thanh niên Cộng sản."]],"a":["C"],"c":5,"s":[482,637,610],"y":"Đại đoàn kết thành lực lượng vật chất có tổ chức là Mặt trận dân tộc thống nhất.","t":"Tổ chức của đại đoàn kết = MẶT TRẬN."},{"n":125,"q":"Trong tư tưởng Hồ Chí Minh, đại đoàn kết dân tộc:","o":[["A","Là vấn đề cơ bản quyết định thành công của cách mạng."],["B","Là vấn đề có ý nghĩa sách lược, quyết định thành công của cách mạng."],["C","Là vấn đề cơ bản có ý nghĩa chiến lược, quyết định thành công của cách mạng."]],"a":["C"],"c":5,"s":[126,291,8],"y":"Đại đoàn kết là vấn đề chiến lược, quyết định thành công.","t":"Chiến lược."},{"n":126,"q":"Trong tư tưởng Hồ Chí Minh, đại đoàn kết dân tộc là:","o":[["A","Đoàn kết công-nông."],["B","Đoàn kết công-nông-lao động trí óc."],["C","Đoàn kết công-nông và các tầng lớp xã hội khác."],["D","Đại đoàn kết toàn dân."]],"a":["D"],"c":5,"s":[125,291,49],"y":"Đại đoàn kết dân tộc là đại đoàn kết toàn dân.","t":"Toàn dân."},{"n":127,"q":"Văn kiện nào của Đảng Lao động Việt Nam đã khẳng định: \"Dân tộc ta, nhân dân ta, non sông đất nước ta đã sinh ra Hồ Chủ Tịch, người anh hùng dân tộc vĩ đại, và chính Người đã làm rạng rỡ dân tộc ta, nhân dân ta và non sông đất nước ta\"?","o":[["A","Báo cáo chính trị tại Đại hội đại biểu toàn quốc lần thứ II của Đảng"],["B","Điếu văn của Ban Chấp hành Trung ương Đảng Lao động Việt Nam tại Lễ Truy điệu Chủ tịch Hồ Chí Minh"],["C","Báo cáo chính trị tại Đại hội đại biểu toàn quốc lần thứ VI của Đảng"],["D","Báo cáo chính trị tại Đại hội đại biểu toàn quốc lần thứ VII của Đảng"]],"a":["B"],"c":4,"s":[],"y":"Câu 'Dân tộc ta… đã sinh ra Hồ Chủ tịch' là của Điếu văn BCH TW (9-1969).","t":"Điếu văn."},{"n":128,"q":"Theo quan điểm của Đảng Cộng sản Việt Nam tại Đại hội đại biểu toàn quốc lần thứ XI, Tư tưởng Hồ Chí Minh là kết quả của sự vận dụng kế thừa giá trị nào?","o":[["A","Sự phát triển chủ nghĩa Mác - Lênin vào điều kiện cụ thể của nước ta"],["B","Sự vận dụng và phát triển sáng tạo chủ nghĩa Mác - Lênin vào điều kiện cụ thể của nước ta"],["C","Sự vận dụng sáng tạo và phát triển chủ nghĩa Mác - Lênin vào điều kiện cụ thể của nước ta"],["D","Sự vận dụn g người = trung tâm."},{"n":223,"q":"Theo Hồ Chí Minh, \"dân là chủ\" để đề cập đến điều gì?","o":[["A","Đề cập tới vị trí của dân"],["B","Đề cập tới trách nhiệm của dân"],["C","Đề cập tới vị thế của dân"],["D","Đề cập tới năng lực của dân"]],"a":["C"],"c":4,"s":[488,567],"y":"'Dân là chủ' nói về vị thế của dân.","t":"Là chủ = vị thế; làm chủ = năng lực, trách nhiệm."},{"n":224,"q":"Một trong những yêu cầu cơ bản trong nghiên cứu tư tưởng Hồ Chí Minh là:","o":[["A","Đảm bảo thống nhất nguyên tắc tính Đảng và tính khoa học"],["B","Đảm bảo thống nhất nguyên tắc tính Nhà nước và tính khoa học"],["C","Đảm bảo thống nhất nguyên tắc tính Đảng và tính Nhà nước"],["D","Đảm bảo thống nhất nguyên tắc tính triết học và tính khoa học"]],"a":["A"],"c":1,"s":[91,7],"y":"Thống nhất tính đảng và tính khoa học.","t":"Tính đảng + khoa học."},{"n":225,"q":"Ngoại ngữ nào sau đây được Hồ Chí Minh học đầu tiên?","o":[["A","Tiếng Anh"],["B","Tiếng Pháp"],["C","Tiếng Trung"],["D","Tiếng Nga"]],"a":["B"],"c":2,"s":[210],"y":"Ngoại ngữ học đầu tiên: tiếng Pháp.","t":"Pháp."},{"n":226,"q":"Chủ nghĩa nào sau đây ảnh hưởng đến sự hình thành tư tưởng Hồ Chí Minh?","o":[["A","Chủ nghĩa dân tộc của Grady."],["B","Chủ nghĩa dân chủ của Kenedy."],["C","Chủ nghĩa tam dân của Tôn Trung Sơn."]],"a":["C"],"c":2,"s":[282,242,340],"y":"Tam dân của Tôn Trung Sơn ảnh hưởng.","t":"Tôn Trung Sơn."},{"n":227,"q":"Trong những câu nói sau đây, câu nào không phải là của Hồ Chí Minh? A \"Muốn được dân yêu, muốn được lòng dân, trước hết phải yêu dân, phải đặt quyền lợi của dân trên hết thảy, phải có một tinh thần chí công vô tư\".","o":[["B","\"Chúng ta đã xây dựng nên nước Việt Nam Dân chủ Cộng hòa. Nhưng nếu nước độc lập mà dân không được hưởng hạnh phúc tự do, thì độc lập cũng chẳng có nghĩa lý gì\"."],["C","\"Chính phủ nhân dân bao giờ cũng phải đặt quyền lợi của dân lên trên hết thảy. Việc gì có lợi cho dân thì phải hết sức làm. Việc gì hại đến dẫn thì phải hết sức tránh\"."],["D","\"Khoan thư sức dân làm kế s ,["C","Tổ chức"],["D","Tất cả các phương án"]],"a":["D"],"c":4,"s":[486,568,528],"y":"Tự đổi mới, chỉnh đốn mọi mặt.","t":"Tất cả."},{"n":498,"q":"Theo Hồ Chí Minh, Đảng cầm quyền vừa là người lãnh đạo, vừa là:","o":[["A","người thầy trung thành của nhân dân."],["B","người hầu trung thành của nhân dân."],["C","người đầy tớ trung thành của nhân dân."],["D","người lính trung thành của nhân dân."]],"a":["C"],"c":4,"s":[494],"y":"Vừa là người lãnh đạo, vừa là đầy tớ trung thành.","t":"Đầy tớ."},{"n":499,"q":"Theo Hồ Chí Minh, nền tảng tư tưởng của Đảng Cộng sản Việt Nam là gì?","o":[["A","Chủ nghĩa xã hội"],["B","Chủ nghĩa Mác-Lênin"],["C","Chủ nghĩa xã hội dân chủ"],["D","Chủ nghĩa Tam dân"]],"a":["B"],"c":4,"s":[501,425,334],"y":"Nền tảng tư tưởng: CN Mác-Lênin.","t":"Mác-Lênin."},{"n":500,"q":"Trong hệ thống tổ chức đảng, Hồ Chí Minh rất coi trọng vai trò của:","o":[["A","Đảng bộ."],["B","Chi ủy."],["C","Chi bộ."]],"a":["C"],"c":4,"s":[],"y":"Coi trọng vai trò chi bộ.","t":"Chi bộ."},{"n":501,"q":"Theo tư tưởng Hồ Chí Minh, nền tảng tư tưởng của Đảng phải dựa trên:","o":[["A","Chủ nghĩa Mác-Lênin."],["B","Nguyên tắc tập trung dân chủ."],["C","Nguyên tắc phê bình và tự phê bình."],["D","Chủ nghĩa xã hội khoa học."]],"a":["A"],"c":4,"s":[499,334,547],"y":"Nền tảng tư tưởng dựa trên CN Mác-Lênin.","t":"Mác-Lênin."},{"n":502,"q":"Tìm ra luận điểm sai trong tư tưởng Hồ Chí Minh khi Người lưu ý tiếp nhận và vận dụng chủ nghĩa Mác - Lênin:","o":[["A","Một là, việc học tập, nghiên cứu, tuyên truyền chủ nghĩa Mác - Lênin phải luôn phù hợp với từng đối tượng."],["B","Hai là, việc vận dụng chủ nghĩa Mác - Lênin phải luôn luôn kiên định trong mọi hoàn cảnh."],["C","Ba là, trong quá trình hoạt động, Đảng ta phải chú ý học tập, kế thừa những kinh nghiệm tốt của các đảng cộng sản khác, đồng thời Đảng ta phải tổng kết kinh nghiệm của mình để bổ sung chủ nghĩa Mác - Lênin."],["D","Bốn là, Đảng ta phải tăng cường đấu tranh để bảo vệ sự trong sáng của chủ nghĩa Mác - Lênin."]],"a":["B"],"c":4,"s":[529,410],"y":"'Kiên định trong mọi hoàn cảnh' là sai; phải vận dụng phù hợp hoàn cảnh.","t":"Bất biến → sai."},{"n":503,"q":"Theo Hồ Chí Minh, Đảng cầm quyền là Đảng tiếp tục lãnh đạo sự nghiệp cách mạng trong điều kiện Đảng lãnh đạo quần chúng nhân dân giành được quyền lực nhà nước và:","o":[["A","Đảng gương mẫu lãnh đạo bộ máy nhà nước đó."],["B","Đảng trực tiếp lãnh đạo bộ máy nhà nước đó."],["C","Đảng khiêm nhường lãnh đạo bộ máy nhà nước đó."],["D","Đảng gián tiếp lãnh đạo bộ máy nhà nước đó."]],"a":["B"],"c":4,"s":[],"y":"Đảng cầm quyền trực tiếp lãnh đạo bộ máy nhà nước.","t":"Lãnh đạo nhà nước."},{"n":504,"q":"Nội dung nào không đúng với tư tưởng Hồ Chí Minh về Thái độ, phương pháp tự phê bình và phê bình:","o":[["A","Phải tiến hành thuờng xuyên như người ta rửa mặt hằng ngày."],["B","Phải thẳng thắn, chân thành, trung thực, không nể nang, không giấu giếm và cũng không thêm bớt khuyết điểm."],["C","\"Phải có tình đồng chí thương yêu lẫn nhau\"."],["D","Phải khôn khéo biến hóa cho phù hợp."]],"a":["D"],"c":4,"s":[],"y":"Phê bình phải trung thực, đúng người, đúng việc, không 'khôn khéo biến hóa'.","t":"Khôn khéo → sai."},{"n":505,"q":"Theo Hồ Chí Minh, bản chất của Đảng:","o":[["A","Không thay đổi khi có chính quyền trong tay."],["B","Luôn thay đổi khi có chính quyền trong tay."],["C","Đôi khi thay đổi khi có chính quyền trong tay."],["D","Đã thay đổi khi có chính quyền trong tay."]],"a":["A"],"c":4,"s":[],"y":"Bản chất Đảng không thay đổi khi có chính quyền.","t":"Không đổi."},{"n":506,"q":"Đối với Hồ Chí Minh, muôn việc thành công hay thất bại là do:","o":[["A","Cán bộ giỏi hay dốt"],["B","Cán bộ tốt hay kém."],["C","Công việc dễ hay khó"]],"a":["B"],"c":4,"s":[],"y":"Muôn việc thành công hay thất bại do cán bộ tốt hay kém.","t":"Cán bộ."},{"n":507,"q":"Theo tư tưởng Hồ Chí Minh, Đảng cộng sản Việt Nam là sản phẩm của sự kết hợp giữa:","o":[["A","Chủ nghĩa Mác-Lênin với phong trào công nhân."],["B","Phong trào công nhân với phong trào yêu nước."],["C","Chủ nghĩa Mác-Lênin với phong trào công nhân và phong trào yêu nước."],["D","Chủ nghĩa Mác - Lênin với phong trào yêu nước."]],"a":["C"],"c":4,"s":[177,270,499],"y":"Mác-Lênin + phong trào công nhân + phong trào yêu nước.","t":"Ba yếu tố."},{"n":508,"q":"\"Việc gì đã được đông người bàn bạc kỹ lưỡng rồi, kế hoạch định rõ ràng rồi, thì cần phải giao cho một người hoặc một nhóm ít người phụ trách theo kế hoạch đó mà thi hành. Như thế mới có chuyên trách, công việc mới chạy. Nếu không có ..... thì sẽ sinh cái tệ người này ủy cho người kia, người kia ủy cho người nọ, kết quả là không ai thi hành. Như thế thì việc gì cũng không xong\"","o":[["A","Tập thể lãnh đạo"],["B","Cá nhân phụ trách"],["C","Cá nhân lãnh đạo"],["D","Tập thể phụ trách"]],"a":["B"],"c":4,"s":[416],"y":"Bàn tập thể xong phải giao cá nhân phụ trách.","t":"Cá nhân phụ trách."},{"n":509,"q":"Theo Hồ Chí Minh, Đảng lãnh đạo phải bằng:","o":[["A","Mệnh lệnh, đòi hỏi, yêu cầu dân chúng."],["B","Dạy dỗ, chỉ bảo dân chúng."],["C","Giáo dục, thuyết phục, tuyên truyền, giác ngộ dân chúng."],["D","Pháp luật, kỷ luật đối với dân chúng."]],"a":["C"],"c":4,"s":[485,486],"y":"Lãnh đạo bằng giáo dục, thuyết phục, không mệnh lệnh.","t":"Thuyết phục."},{"n":510,"q":"Theo tư tưởng Hồ Chí Minh, Đảng Cộng sản Việt Nam là Đảng của:","o":[["A","Giai cấp công nhân."],["B","Giai cấp công nhân, nhân dân lao động và của dân tộc Việt Nam."],["C","Nhân dân lao động"],["D","Giai cấp công nhân, nhân dân lao động"]],"a":["B"],"c":4,"s":[103,270,102],"y":"Đảng của giai cấp công nhân, nhân dân lao động và dân tộc.","t":"Ba chủ thể."},{"n":511,"q":"Theo Hồ Chí Minh, Đảng không phải là một tổ chức tự thân, mà có tổ chức chặt chẽ và vì vậy, mục đích, tôn chỉ của Đảng là \"tận tâm\", \"tận lực\", \"phụng sự\" và \"trung thành\" với:","o":[["A","Lợi ích của dân tộc Việt Nam"],["B","Lợi ích của Đảng"],["C","Lợi ích của giai cấp công nhân"]],"a":["A"],"c":4,"s":[],"y":"Trung thành với lợi ích dân tộc.","t":"Dân tộc."},{"n":512,"q":"Tr c tập kinh nghiệm của các đảng cộng sản anh em, nhưng phải tính đến những điều kiện cụ thể của đất nước và của:","o":[["A","Loài người."],["B","Thời đại."],["C","Dân tộc."]],"a":["B"],"c":4,"s":[],"y":"Tính đến điều kiện đất nước và thời đại.","t":"Thời đại."},{"n":520,"q":"Hồ Chí Minh cho rằng cán bộ, đảng viên phải lưu ý cái gì có lợi cho dân dù nhỏ đến mấy cũng phải:","o":[["A","Cố mà làm"],["B","Phấn đấu"],["C","Cố gắng"]],"a":["A"],"c":4,"s":[419],"y":"Có lợi cho dân dù nhỏ cũng cố mà làm.","t":"Làm."},{"n":521,"q":"Hồ Chí Minh khẳng định sức mạnh của Đảng bắt nguồn từ:","o":[["A","Con người."],["B","Tổ chức."],["C","Dân tộc."]],"a":["B"],"c":4,"s":[],"y":"Sức mạnh Đảng bắt nguồn từ tổ chức (kỷ luật).","t":"Tổ chức."},{"n":522,"q":"Trong tác phẩm \"Đường cách mệnh\", theo Hồ Chí Minh cách mạng trước hết phải có:","o":[["A","Đảng cách mạng"],["B","Quần chúng cách mạng"],["C","Lực lượng cách mạng"],["D","Vũ trang cách mạng"]],"a":["A"],"c":3,"s":[512,274],"y":"Cách mạng trước hết phải có đảng cách mạng.","t":"Đảng."},{"n":523,"q":"Trong các nội dung sau đâu là nội dung không đúng?","o":[["A","Phong trào yêu nước có vị trí, vai trò cực kỳ to lớn trong quá trình phát triển của dân tộc Việt Nam."],["B","Phong trào công nhân kết hợp được với phong trào yêu nước bởi vì hai phong trào đó đều có mục tiêu chung."],["C","Phong trào yêu nước của trí thức Việt Nam là nhân tố quan trọng thúc đẩy sự kết hợp các yếu tố cho sự ra đời của Đảng Cộng sản Việt Nam."],["D","Phong trào nông dân không kết hợp được với phong trào công nhân."]],"a":["D"],"c":4,"s":[],"y":"Thực tế phong trào nông dân kết hợp được với phong trào công nhân.","t":"Câu phủ định."},{"n":524,"q":"Theo Hồ Chí Minh, nội dung quy định bản chất giai cấp công nhân là:","o":[["A","Số lượng đảng viên xuất thân từ giai cấp công nhân."],["B","Nền tảng lý luận và tư tưởng của Đảng là chủ nghĩa Mác - Lênin."],["C","Tất cả các phương án"]],"a":["B"],"c":3,"s":[407,491],"y":"Bản chất GCCN quy định bởi nền tảng lý luận Mác-Lênin.","t":"Mác-Lênin."},{"n":525,"q":"Theo Hồ Chí Minh, Là người lãnh đạo, nhưng Đảng phải sâu sát, gắn bó mật thiết với nhân dân, lắng nghe ý kiến của nhân dân, khiêm tốn học hỏi nhân dân và:","o":[["A","Phải không được kiểm soát nhân dân."],["B","Phải kiểm soát được nhân dân."],["C","Phải chịu sự kiểm soát của nhân dân."]],"a":["C"],"c":4,"s":[572],"y":"Đảng phải chịu sự kiểm soát của nhân dân.","t":"Dân kiểm soát Đảng."},{"n":526,"q":"Theo Hồ Chí Minh, Đảng Cộng sản Việt Nam phải lấy chủ nghĩa Mác-Lênin \"làm cốt\" nghĩa là:","o":[["A","Đảng Cộng sản Việt Nam phải lấy chủ nghĩa Mác-Lênin làm nền tảng tư tưởng."],["B","Đảng Cộng sản Việt Nam phải lấy chủ nghĩa Mác-Lênin làm chủ trương, đường lối."],["C","Đảng Cộng sản Việt Nam phải lấy chủ nghĩa Mác-Lênin làm học thuyết của Đảng."],["D","Tất cả các phương án."]],"a":["A"],"c":4,"s":[499,270,177],"y":"'Làm cốt' = làm nền tảng tư tưởng.","t":"Nền tảng."},{"n":527,"q":"Hồ Chí Minh chỉ ra nguyên tắc quan hệ giữa Đảng với dân là:","o":[["A","Đảng viên, cán bộ vừa là người lãnh đạo, vừa là người đầy tớ thật trung thành của nhân dân"],["B","Đảng viên, cán bộ vừa là người lãnh đạo, vừa là người đầy tớ thật trung thành của người lao động."],["C","Đảng viên, cán bộ vừa là người lãnh đạo, vừa là người đầy tớ thật trung thành của mọi người."]],"a":["A"],"c":4,"s":[440],"y":"Cán bộ vừa lãnh đạo vừa đầy tớ.","t":"Vừa…vừa."},{"n":528,"q":"Theo Hồ Chí Minh, Mục đích phê bình là:","o":[["A","Cốt để giúp nhau sửa chữa, giúp nhau tiến bộ."],["B","Cốt để đổi cách làm việc cho tốt hơn, đúng hơn."],["C","Cốt để đoàn kết và thống nhất nội bộ."],["D","Tất cả các phương án."]],"a":["D"],"c":4,"s":[568,497,487],"y":"Phê bình nhằm nhiều mục đích.","t":"Tất cả."},{"n":529,"q":"Trong việc tiếp nhận và vận dụng chủ nghĩa Mác-Lênin, Hồ Chí Minh lưu ý Đảng ta phải tăng cường đấu tranh để:","o":[["A","Bảo vệ sự trong sáng của chủ nghĩa Mác - Lênin."],["B","Bảo vệ sự trong sáng của Đảng Cộng sản Việt Nam."],["C","Bảo vệ chính quyền."],["D","Bảo vệ nhân dân."]],"a":["A"],"c":4,"s":[502,334,547],"y":"Bảo vệ sự trong sáng của Mác-Lênin.","t":"Trong sáng."},{"n":530,"q":"Theo Hồ Chí Minh, chức năng lãnh đạo và sự lãnh đạo của Đảng phải:","o":[["A","Bảo đảm trên tất cả các mặt, các lĩnh vực, phải quan tâm chăm lo đến đời sống nhân dân ở những việc nhỏ."],["B","Bảo đảm trên tất cả các mặt, các lĩnh vực, phải quan tâm chăm lo đến đời sống nhân dân từ việc nhỏ đến việc lớn."],["C","Bảo đảm trên tất cả các mặt, các lĩnh vực, phải quan tâm chăm lo đến đời sống nhân dân ở những việc lớn."]],"a":["B"],"c":4,"s":[],"y":"Lãnh đạo toàn diện, chăm lo đời sống từ việc nhỏ đến lớn.","t":"Toàn diện."},{"n":531,"q":"Hồ Chí Minh đã dùng từ nào sau đây để chỉ tính nghiêm minh của pháp luật","o":[["A","Thần linh pháp quyền"],["B","Tinh thần pháp luật"],["C","Nhà nước pháp quyền"],["D","Nhà nước hợp hiến"]],"a":["A"],"c":4,"s":[],"y":"'Trăm điều phải có thần linh pháp quyền' nói về tính nghiêm minh của pháp luật.","t":"Thần linh pháp quyền."},{"n":532,"q":"Theo Hồ Chí Minh, văn hoá không thể đứng ngoài mà phải ở trong kinh tế và chính trị, phải:","o":[["A","phục vụ nhiệm vụ kinh tế và thúc đẩy sự phát triển của chính trị."],["B","phục vụ nhiệm vụ chính trị và thúc đẩy sự phát triển của kinh tế."],["C","phục vụ nhiệm vụ văn hóa và thúc đẩy sự phát triển của kinh tế, chính trị."]],"a":["B"],"c":6,"s":[],"y":"Văn hóa phục vụ chính trị và thúc đẩy kinh tế.","t":"Phục vụ + thúc đẩy."},{"n":533,"q":"Trong tư tưởng đạo đức Hồ Chí Minh, đức và tài, hồng và chuyên, phẩm chất và năng lực thống nhất làm một. Đó là đạo đức trong hành động, lấy:","o":[["A","Số lượng công việc làm thước đo."],["B","Hiệu quả thực tế làm thước đo."],["C","Chất lượng công việc làm thước đo."],["D","Trình độ chuyên môn nghiệp vụ làm thước đo."]],"a":["B"],"c":6,"s":[],"y":"Đạo đức trong hành động, lấy hiệu quả thực tế làm thước đo.","t":"Hiệu quả."},{"n":534,"q":"Theo Hồ Chí Minh, tính dân tộc của nền văn hoá là đặc tính dân tộc, cốt cách dân tộc, chiều sâu bản chất rất đặc trưng của văn hoá dân tộc, không nhầm lẫn với:","o":[["A","Văn hoá của các dân tộc khác."],["B","Tinh hoa của các dân tộc khác."],["C","Văn minh của các dân tộc khác."]],"a":["A"],"c":6,"s":[],"y":"Tính dân tộc: không nhầm lẫn với văn hóa dân tộc khác.","t":"Không nhầm lẫn."},{"n":535,"q":"Đối với một quốc gia: cần, kiệm, liêm, chính là thước đo sự giàu có về vật chất, vững mạnh về tinh thần, thể hiện:","o":[["A","Sự văn minh tiến bộ."],["B","Văn hóa cao"],["C","Truyền thống tốt đẹp"],["D","Văn hiến lâu đời"]],"a":["A"],"c":6,"s":[],"y":"Cần kiệm liêm chính là thước đo văn minh, tiến bộ.","t":"Văn minh."},{"n":536,"q":"Câu nói nào sau đây là của Hồ Chí Minh?","o":[["A","Học không biết chán, dạy không biết mỏi"],["B","Học, học nữa, học mãi"],["C","Việc học không bao giờ cùng, còn sống còn phải học"]],"a":["C"],"c":6,"s":[],"y":"'Việc học không bao giờ cùng, còn sống còn phải học'.","t":"Học suốt đời."},{"n":537,"q":"Theo Hồ Chí Minh phải chú trọng \"đạo làm gương\". Đối với Người \"một tấm gương sống còn có giá trị hơn:","o":[["A","một trăm bài diễn văn tuyên truyền\","],["B","một trăm hòm vàng\","],["C","một trăm tủ sách\","]],"a":["A"],"c":6,"s":[],"y":"Tấm gương sống hơn một trăm bài diễn văn.","t":"Một trăm."},{"n":538,"q":"Theo Hồ Chí Minh, văn hóa là đời sống tinh thần của xã hội, thuộc:","o":[["A","Kiến trúc thượng tầng"],["B","Cơ sở hạ tầng"],["C","Tất cả các phương án"]],"a":["A"],"c":6,"s":[],"y":"Văn hóa thuộc kiến trúc thượng tầng.","t":"Thượng tầng."},{"n":539,"q":"Chiến lược trồng người được Hồ Chí Minh xác định ở vị trí nào trong sự phát triển kinh tế xã hội?","o":[["A","Cơ bản"],["B","Trọng tâm"],["C","Quan trọng"],["D","Cần thiết"]],"a":["A"],"c":6,"s":[],"y":"Trồng người ở vị trí cơ bản.","t":"Cơ bản."},{"n":540,"q":"Yêu thương con người được Hồ Chí Minh xác định là một trong những phẩm chất đạo đức cao đẹp nhất. Người nói, người cách mạng là người giàu tình cảm, có tình cảm cách mạng:","o":[["A","mới đi làm cách mạng."],["B","mới yêu thương con người."],["C","mới là người cách mạng."]],"a":["A"],"c":6,"s":[],"y":"Có tình cảm cách mạng mới đi làm cách mạng.","t":"Tình cảm."},{"n":541,"q":"Theo Hồ Chí Minh, tính đại chúng của nền văn hoá là phải phục vụ nhân dân và do:","o":[["A","Nhà nước xây dựng nên."],["B","Nhân dân xây dựng thêm."],["C","Nhân dân xây dựng nên."],["D","Nhà nước xây dựng thêm."]],"a":["C"],"c":6,"s":[],"y":"Tính đại chúng: phục vụ nhân dân và do nhân dân xây dựng.","t":"Do dân."},{"n":542,"q":"Tính khoa học của văn hoá đòi hỏi phải đấu tranh chống lại chủ nghĩa duy tâm, thần bí, mê tín dị đoan, phải biết gạn đục, khơi trong, là sự kế thừa truyền thống tốt đẹp của dân tộc và tiếp thu:","o":[["A","Tinh hoa văn hoá nhân loại."],["B","Bản sắc văn hoá nhân loại."],["C","Truyền thống văn hoá nhân loại."],["D","Tính dân tộc của văn hóa nhân loại."]],"a":["A"],"c":6,"s":[],"y":"Tính khoa học: gạn đục khơi trong, tiếp thu tinh hoa nhân loại.","t":"Tinh hoa."},{"n":543,"q":"Khái niệm con người trong tư tưởng Hồ Chí Minh để chỉ:","o":[["A","Một con người cụ thể."],["B","Một cộng đồng người."],["C","Con người cụ thể gắn với hoàn cảnh lịch sử cụ thể."],["D","Tất cả các phương án."]],"a":["C"],"c":6,"s":[630,207],"y":"Con người cụ thể gắn với hoàn cảnh lịch sử cụ thể.","t":"Cụ thể."},{"n":544,"q":"Hồ Chí Minh xem xét con người trong sự thống nhất của hai mặt đối lập: thiện và ác, hay và dở, tốt và xấu, hiền và dữ,... nhưng:","o":[["A","\"dù là xấu, tốt, văn minh hay dã man đều có lý\"."],["B","\"dù là xấu, tốt, văn minh hay dã man đều có tình\"."],["C","\"dù là xấu, tốt, văn minh hay dã man đều có đức\"."],["D","\"dù là xấu, tốt, văn minh hay dã man đều có học\"."]],"a":["B"],"c":6,"s":[],"y":"'Dù là xấu, tốt, văn minh hay dã man đều có tình'.","t":"Có tình."},{"n":545,"q":"Loại giặc nào được Hồ Chí Minh đề cập đầu tiên?","o":[["A","Giặc dốt"],["B","Giặc đói"],["C","Giặc ngoại xâm"]],"a":["B"],"c":6,"s":[],"y":"Sau 1945 giặc đói được nêu đầu tiên, rồi giặc dốt, giặc ngoại xâm.","t":"Đói – dốt –
